<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>极速弯心 APEX RACER — 俯视 F1</title>
<style>
  html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(rgba(14,19,26,0.78), rgba(14,19,26,0.78)), url('assets/stadium-bg.jpg') center/cover no-repeat fixed #141a22;}
  #wrap{position:relative;}
  canvas{width:min(96vw,calc(96vh*1.467));background:#24501f;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:block;}
  #hint{color:#7c8b9d;font-size:13px;text-align:center;margin-top:10px;letter-spacing:.5px;}
  b{color:#c8d3de;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1100" height="750"></canvas>
  <div id="hint"><b>↑/W</b> 油门 · <b>↓/S</b> 刹车 · <b>←→/AD</b> 转向 · <b>V</b> 镜头 · 菜单 <b>Q/E</b> 选赛道 <b>A/D</b> 选难度</div>
</div>
<script>
/* ============================================================
   极速弯心 APEX RACER · v0.13.3
   俯视 F1：三条特色赛道（放大版）+ 向量物理 + 尾流超车 + 6 车攻防
   v0.10.0：赛道库（眼镜蛇/漩涡/战斧）/ AI 赛车线 / 路肩贴弯内缘 /
          尾流 ×1.1 / 修 V 键
   v0.11.0：赛道整体放大 ×2（一圈 30 多秒）/ 路肩沿内侧沥青边缘整段铺
   v0.11.1：路肩渲染做减法——白底红杠经典路肩带（不再逐颗香肠乱飞）/
          尾流删繁就简（只留气带+小字，去掉光圈和提示音）
   v0.11.2：修路肩翻错边→终版：采样点落进路面就迭代推出，推不出跳过断线 /
          声浪按真实 F1 数据重做（点火基频+4倍谐波+涡轮哨声）
   v0.11.3：声浪转低沉轰鸣（基频 190~340Hz+低八度+低通 1.5kHz+频率微抖）/
          AI 过弯按弯半径算速度（v=√(a·r)，同弯同速）+刹车曲线 /
          难度上调（困难直道 ~320、刹车更晚）
   v0.12.0：6 车同场（+白队/紫队）/ AI 加交通意识——贴近跟住不硬撞、
          横向拉出抽头超车（攻防列车而不是碰碰车）
   v0.12.2：尾流对所有车生效 / AI 攻防规则化 / 碰撞改长方形判定
   v0.12.3：AI 马力压玩家一头——直道尾速 322~358（玩家 330）+
          弯道横向加速度上限 130→180（过弯不再怂）+ 刹车更晚
   v0.12.4：回调过量——AI 起步加速度 283→129~167（≈玩家 150），
          尾速差收窄（中等 334~342 / 困难 342~350），能玩不等于让着你
   v0.12.5：再平衡——中等比玩家能打 5%（加速 168/尾速 342~350）、
          困难强 10~15%（加速 192/尾速 350~358），弯道快保留
   v0.13.0：8 车 8 支真实 F1 涂装 / 抽头选弯内线+平滑过渡 /
          超越期超速+40 / 弯速 180→210
   v0.13.1：梅奔索伯配色对调（其余同 v0.13.0）
   v0.13.2：修 AI 弯中太慢的真凶（保镖误伤赛车线），弯中 230→300+
   v0.13.3：尾流区横向加宽（±34→±55，抽头拉出去不脱 tow）/
          高速风阻流线（>240 才出现的很淡速度线）
   ============================================================ */

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 1100, H = 750, CX = W / 2, CY = H / 2;

// ---------- 赛道库 ----------
// 每条赛道约定：pts[0]→pts[1] 是主直道（行进方向），startS = 起点线距 pts[0] 的沿道距离
var TRACKS = [
  { name:'眼镜蛇', en:'COBRA', startS:400, pts:[
    [300,1150],[1500,1150],                                // 主直道（起终点）
    [1690,1120],[1800,1035],[1750,930],[1600,905],         // T1 大发卡（右，180° 掉头）
    [1450,905],                                            // 出卡短直道
    [1310,850],[1190,920],[1070,835],[1000,720],           // 连续 S 弯（左右左）
    [960,580],[955,450],[990,330],                         // 全速扫弯（向北）
    [900,225],[765,185],[640,265],[590,400],               // 之字减速弯
    [580,540],[600,700],                                   // 后直道（向南）
    [575,840],[480,945],[350,1000],[215,1070],[170,1150]   // 最后连续弯 + 紧收尾
  ] },
  { name:'漩涡', en:'VORTEX', startS:400, pts:[
    [250,1080],[1350,1080],                                // 主直道
    [1530,1040],[1650,900],[1690,720],[1650,560],          // 大弧度右扫弯（全速）
    [1560,430],[1410,360],[1260,380],                      // 顶部左弯
    [1130,480],[1090,610],[1140,730],                      // 螺旋收拢（半径越收越小）
    [1010,800],[860,790],                                  // 出螺旋短直道
    [720,720],[700,580],[780,470],                         // 内钩之字
    [720,340],[580,280],[450,320],                         // 左上组合弯
    [330,430],[280,600],[300,780],                         // 左侧长左弯
    [240,920],[230,1040]                                   // 收尾回主直道
  ] },
  { name:'战斧', en:'TOMAHAWK', startS:400, pts:[
    [300,1120],[1200,1120],                                // 主直道（短）
    [1360,1090],[1460,980],[1440,840],                     // T1-T2 右弯组
    [1520,700],[1640,640],[1690,520],                      // 加速上山弯
    [1700,350],[1620,240],[1470,230],[1380,330],[1330,470],// 山顶双顶点发卡
    [1240,600],[1150,720],[1010,770],                      // 下切进内场
    [860,740],[790,620],[830,480],                         // 内场 S 弯
    [730,370],[590,320],[460,370],                         // 左上弯组
    [360,490],[330,660],[370,820],                         // 左侧下行
    [310,950],[270,1070]                                   // 收尾回主直道
  ] }
];
var trackIdx = 0;
var TRACK, SEGN;
var ROAD_HALF = 84;
var TRACK_SCALE = 2.0;     // 赛道整体放大倍数（一圈 30 多秒）
var START_S = 400;          // 起点线在主直道上距 pts[0] 的沿道距离（放大后）
var TOTAL_LAPS = 5;

// 赛道边界（镜头限制用）+ 主直道方向（压线判定/发车格用）
var BD = { x0: 0, y0: 0, x1: 0, y1: 0 };
var SEG0X = 1, SEG0Y = 0, SEG0OX = 0, SEG0OY = 0;
function selectTrack(k) {
  trackIdx = ((k % TRACKS.length) + TRACKS.length) % TRACKS.length;
  var raw = TRACKS[trackIdx].pts;
  // 绕重心整体放大（弯的相对形状不变，路面宽度不变 → 弯相对更"宽"更好开）
  var ccx = 0, ccy = 0;
  for (var ci = 0; ci < raw.length; ci++) { ccx += raw[ci][0]; ccy += raw[ci][1]; }
  ccx /= raw.length; ccy /= raw.length;
  TRACK = [];
  for (ci = 0; ci < raw.length; ci++) {
    TRACK.push([Math.round(ccx + (raw[ci][0] - ccx) * TRACK_SCALE),
                Math.round(ccy + (raw[ci][1] - ccy) * TRACK_SCALE)]);
  }
  SEGN = TRACK.length;
  START_S = TRACKS[trackIdx].startS * TRACK_SCALE;
  BD = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
  for (var bi = 0; bi < SEGN; bi++) {
    BD.x0 = Math.min(BD.x0, TRACK[bi][0]); BD.x1 = Math.max(BD.x1, TRACK[bi][0]);
    BD.y0 = Math.min(BD.y0, TRACK[bi][1]); BD.y1 = Math.max(BD.y1, TRACK[bi][1]);
  }
  var MARGIN = 300;
  BD.x0 -= MARGIN; BD.y0 -= MARGIN; BD.x1 += MARGIN; BD.y1 += MARGIN;
  SEG0OX = TRACK[0][0]; SEG0OY = TRACK[0][1];
  var dx = TRACK[1][0] - SEG0OX, dy = TRACK[1][1] - SEG0OY;
  var dm = Math.sqrt(dx*dx + dy*dy) || 1;
  SEG0X = dx / dm; SEG0Y = dy / dm;
}
selectTrack(0);

// ---------- 镜头（0=近追 1=全景，按 V 切换） ----------
var cam = { x: 0, y: 0 };
var camMode = 0;
function overView() {                              // 全景视角的缩放+居中参数
  var s = Math.min(W / (BD.x1 - BD.x0), H / (BD.y1 - BD.y0)) * 0.98;
  return { s: s, ox: (BD.x0 + BD.x1) / 2 - W / 2 / s, oy: (BD.y0 + BD.y1) / 2 - H / 2 / s };
}
function camFollow(c, dt) {
  var tx = c.x - W / 2, ty = c.y - H / 2;
  cam.x += (tx - cam.x) * Math.min(1, dt * 5);
  cam.y += (ty - cam.y) * Math.min(1, dt * 5);
  cam.x = Math.max(BD.x0, Math.min(BD.x1 - W, cam.x));
  cam.y = Math.max(BD.y0, Math.min(BD.y1 - H, cam.y));
}

// 点到线段距离
function segDist(px, py, a, b) {
  var vx = b[0]-a[0], vy = b[1]-a[1];
  var t = ((px-a[0])*vx + (py-a[1])*vy) / (vx*vx+vy*vy);
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  var dx = px - (a[0]+vx*t), dy = py - (a[1]+vy*t);
  return Math.sqrt(dx*dx + dy*dy);
}
function nearestSeg(px, py) {
  var bi = 0, bd = 1e9;
  for (var i = 0; i < SEGN; i++) {
    var d = segDist(px, py, TRACK[i], TRACK[(i+1) % SEGN]);
    if (d < bd) { bd = d; bi = i; }
  }
  return { i: bi, d: bd };
}
function nearestPt(px, py) {
  var bx = 0, by = 0, bd = 1e9;
  for (var i = 0; i < SEGN; i++) {
    var a = TRACK[i], b = TRACK[(i+1) % SEGN];
    var vx = b[0]-a[0], vy = b[1]-a[1];
    var t = ((px-a[0])*vx + (py-a[1])*vy) / (vx*vx+vy*vy);
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var x = a[0]+vx*t, y = a[1]+vy*t;
    var d = (px-x)*(px-x) + (py-y)*(py-y);
    if (d < bd) { bd = d; bx = x; by = y; }
  }
  return { x: bx, y: by };
}

// ---------- 音效（按真实 F1 V6 涡轮混动数据调） ----------
// 实测资料：转速上限 15000rpm；声能集中在 2~4kHz；V6 四冲程每转 3 次点火
// → 点火基频 = rpm/60×3（约 460~750Hz）， scream 来自 4 倍谐波（≈2~3kHz），
// 涡轮 10 万转以上叠一层 5~6.5kHz 的哨声
var AC = null, engO = null, engO2 = null, engO3 = null, engF = null, engG = null, engG2 = null, engG3 = null;
function ac() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  return AC;
}
function engineStart() {
  var a = ac(); if (!a || engO) return;
  // 低沉轰鸣取向：点火基频压低（190~340Hz）+ 低八度副波垫厚度 +
  // 低通压到 1.5kHz 滤掉"电子味"毛刺，涡轮哨声只留若有若无的一层
  engF = a.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.value = 1500; engF.Q.value = 0.6;
  engG = a.createGain(); engG.gain.value = 0.05;      // 点火基频（锯齿波主体）
  engG2 = a.createGain(); engG2.gain.value = 0.035;   // 低八度（轰鸣的厚度）
  engG3 = a.createGain(); engG3.gain.value = 0.003;   // 涡轮哨声（很轻）
  engO = a.createOscillator(); engO.type = 'sawtooth'; engO.frequency.value = 200;
  engO2 = a.createOscillator(); engO2.type = 'sawtooth'; engO2.frequency.value = 100;
  engO3 = a.createOscillator(); engO3.type = 'sine'; engO3.frequency.value = 3800;
  engO.connect(engG); engG.connect(engF);
  engO2.connect(engG2); engG2.connect(engF);
  engO3.connect(engG3); engG3.connect(engF);
  engF.connect(a.destination);
  engO.start(); engO2.start(); engO3.start();
}
function engineStop() {
  if (engO) { try { engO.stop(); engO2.stop(); engO3.stop(); } catch(e){} engO = null; engO2 = null; engO3 = null; }
}
function engineTick(sp) {
  if (!engO || !AC) return;
  // 模拟 8 档变速箱：档内转速 3800→6400 爬升，升档回落；频率带 ±0.8% 抖动（不像电子音那么死）
  var gear = Math.floor(sp / 55);
  var frac = (sp - gear * 55) / 55;
  var rpm = 3800 + gear * 350 + frac * 2600;
  var wob = 1 + Math.sin(raceT * 47) * 0.008;
  var f = rpm / 60 * 3 * wob;                  // 点火基频：190~340Hz
  var t = AC.currentTime;
  engO.frequency.setValueAtTime(f, t);
  engO2.frequency.setValueAtTime(f * 0.5, t);          // 低八度垫厚度
  engO3.frequency.setValueAtTime(1800 + rpm * 0.3, t); // 涡轮哨声随转速升高
}
function beep(f, dur, vol) {
  var a = ac(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.frequency.value = f; o.type = 'square';
    g.gain.setValueAtTime(vol || 0.05, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  } catch (e) {}
}
function thud() {   // 金属撞击
  var a = ac(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(1800, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, a.currentTime + 0.06);
    g.gain.setValueAtTime(0.07, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.07);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.08);
  } catch (e) {}
}

// ---------- AI 难度 ----------
var DIFFAI = [
  { label:'🐣 简单', skill: -0.08, acc: 0.85, straight: -6 },
  { label:'😊 中等', skill: 0,     acc: 1.05, straight: 10 },
  { label:'😈 困难', skill: 0.16,  acc: 1.2,  straight: 18 }
];
var diffIdx = 1;

// ---------- 赛车 ----------
var TEAMS = [   // 按真实 F1 车队涂装
  { name:'你·法拉利', body:'#DC0000', wing:'#1a1a1a' },      // 法拉利：红+黑翼
  { name:'红牛',      body:'#232B4E', wing:'#FFD34D' },      // 红牛：深藏青+黄翼
  { name:'迈凯伦',    body:'#FF8000', wing:'#16324F' },      // 迈凯伦：木瓜橙+蓝黑翼
  { name:'梅奔',      body:'#181818', wing:'#52E252' },      // 梅赛德斯（配色按制作人要求与索伯对调）
  { name:'马丁',      body:'#00594F', wing:'#C8F542' },      // 阿斯顿马丁：英伦绿+荧光翼
  { name:'威廉姆斯',  body:'#E8ECF2', wing:'#005AFF' },      // 威廉姆斯：白+蓝翼
  { name:'Alpine',   body:'#2293D1', wing:'#FF6EB4' },      // Alpine：蓝+粉翼
  { name:'索伯',      body:'#1f1f1f', wing:'#00A19B' }       // 索伯（配色按制作人要求与梅奔对调）
];
var cars = [];
function mkCar(i, gx, gy) {
  return {
    team: i, x: gx, y: gy, angle: 0, speed: 0, latS: 0,
    lap: 0, lastSeg: SEGN - 2, lapT: 0, bestLap: 0,
    aiSkill: 0.97 + i * 0.035, finished: false, finishT: 0,
    offT: 0, rejoinX: 0, rejoinY: 0, prevX: gx, prevY: gy, passSide: 0, passOffset: 0
  };
}
var state = 'menu';
var raceT = 0, startLights = 0;

function startRace() {
  cars = [];
  var offs = [[-60,-28],[-115,28],[-170,-28],[-225,28],[-280,-28],[-335,28],[-390,-28],[-445,28]];   // 发车格 8 位（相对起点线：沿道后退/横向交错）
  var nx = -SEG0Y, ny = SEG0X;
  for (var i = 0; i < offs.length; i++) {
    var s = START_S + offs[i][0], l = offs[i][1];
    var c = mkCar(i, SEG0OX + SEG0X*s + nx*l, SEG0OY + SEG0Y*s + ny*l);
    c.angle = Math.atan2(SEG0Y, SEG0X);
    cars.push(c);
  }
  raceT = 0; startLights = 2.2; sparks = [];
  state = 'race';
  engineStart();
}

// ---------- 按键 ----------
var KEYS = {};
addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k) >= 0) e.preventDefault();
  if (e.repeat) return;
  KEYS[k] = true;
  if (state === 'menu') {
    if (k === 'a' || k === 'arrowleft')  diffIdx = (diffIdx + 2) % 3;
    if (k === 'd' || k === 'arrowright') diffIdx = (diffIdx + 1) % 3;
    if (k === 'q') selectTrack(trackIdx + 2);
    if (k === 'e') selectTrack(trackIdx + 1);
    if (k === 'enter') startRace();
  } else if (state === 'race') {
    if (k === 'v') camMode = 1 - camMode;            // 比赛中 V 切镜头
  } else if (state === 'over') {
    if (k === 'enter') state = 'menu';
  }
});
addEventListener('keyup', function (e) { KEYS[e.key.toLowerCase()] = false; });
// 屏幕按钮（鼠标可点）
var BTNS = [];
function btnPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
cv.addEventListener('click', function (e) {
  var r = cv.getBoundingClientRect();
  var x = (e.clientX - r.left) * (cv.width / r.width);
  var y = (e.clientY - r.top) * (cv.height / r.height);
  for (var i = 0; i < BTNS.length; i++) {
    var b = BTNS[i];
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); break; }
  }
});
function kL() { return KEYS['arrowleft'] || KEYS['a']; }
function kR() { return KEYS['arrowright'] || KEYS['d']; }
function kU() { return KEYS['arrowup'] || KEYS['w']; }
function kD() { return KEYS['arrowdown'] || KEYS['s']; }

// ---------- 物理（向量模型：纵向油门 + 横向抓地甩尾） ----------
function stepCar(c, dt, isPlayer) {
  c.prevX = c.x; c.prevY = c.y;              // 本帧起始位置（压线判定用）
  var ns = nearestSeg(c.x, c.y);
  var onRoad = ns.d < ROAD_HALF + 8;

  if (isPlayer) {
    if (kU()) c.speed += (onRoad ? (c.slip ? 170 : 150) : 45) * dt;   // 草地上油门没劲（速度才降得下来）
    if (kD()) c.speed -= 430 * dt;                   // F1 刹车很猛
  }
  c.speed -= c.speed * 0.22 * dt;
  var cap = c.slip ? 363 : 330;                      // 尾流里极速 ×1.1
  if (c.speed > cap) c.speed -= (c.speed - cap) * 2.5 * dt + 30 * dt;
  if (c.speed < 0) c.speed = 0;

  var steer = 0;
  if (isPlayer) { if (kL()) steer -= 1; if (kR()) steer += 1; }
  var steerRate = 3.0 - Math.min(c.speed / 330, 1) * 1.1;
  var dA = steer * steerRate * dt;
  c.angle += dA;
  if (steer) c.speed -= c.speed * 0.32 * dt;         // 打方向自带一点刹车（循迹感）
  c.latS += steer * c.speed * dA * 0.9;              // 离心把车身往外甩
  c.latS -= c.latS * Math.min(1, (onRoad ? 9 : 3.2) * dt);

  var fx = Math.cos(c.angle), fy = Math.sin(c.angle);
  c.x += (fx * c.speed - fy * c.latS) * dt;
  c.y += (fy * c.speed + fx * c.latS) * dt;

}
function writeVel(c, v) {
  var fx = Math.cos(c.angle), fy = Math.sin(c.angle);
  c.speed = Math.max(0, v.x * fx + v.y * fy);
  c.latS = v.x * (-fy) + v.y * fx;
}
function carCollide(dt) {
  for (var i = 0; i < cars.length; i++) {
    for (var j = i + 1; j < cars.length; j++) {
      var a = cars[i], b = cars[j];
      var dx = b.x - a.x, dy = b.y - a.y, d2 = dx*dx + dy*dy;
      if (d2 > 70*70 || d2 < 0.01) continue;
      // 长方形判定（车长 65 车宽 37，在各自车身系里算重叠）——并排跟车不再被圆形判定误伤
      var ca = Math.cos(a.angle), sa = Math.sin(a.angle);
      var fxA = dx*ca + dy*sa, sxA = -dx*sa + dy*ca;
      var cb = Math.cos(b.angle), sb = Math.sin(b.angle);
      var fxB = -dx*cb - dy*sb, sxB = dx*sb - dy*cb;
      var hit = (Math.abs(fxA) < 56 && Math.abs(sxA) < 34) || (Math.abs(fxB) < 56 && Math.abs(sxB) < 34);
      if (!hit) continue;
      var d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      var pen = Math.max(0, 58 - d);              // 分离量：把重叠的车推开
      if (pen > 0) {
        var sp = pen / d * 0.5;
        a.x -= dx*sp; a.y -= dy*sp;
        b.x += dx*sp; b.y += dy*sp;
      }
      var va = velOf(a), vb = velOf(b);
      var rel = (va.x - vb.x) * nx + (va.y - vb.y) * ny;
      if (rel > 25) {
        // 法线冲量交换（恢复系数 0.65）+ 各损失一点速度（动能损耗）
        var j2 = rel * 0.825;
        va.x -= nx*j2; va.y -= ny*j2;
        vb.x += nx*j2; vb.y += ny*j2;
        writeVel(a, va); writeVel(b, vb);
        a.speed *= 0.94; b.speed *= 0.94;
        // 甩头震动：撞上那一下车身会被震歪一点
        a.angle += (Math.random() - 0.5) * 0.12;
        b.angle += (Math.random() - 0.5) * 0.12;
        spawnSparks(a.x + nx * d / 2, a.y + ny * d / 2, rel);
        thud();
      } else {
        // 贴在一起蹭：持续减速刮擦
        a.speed *= (1 - dt * 0.8); b.speed *= (1 - dt * 0.8);
      }
    }
  }
}

// ---------- 名次 ----------
function progress(c) { return c.lap * SEGN + nearestSeg(c.x, c.y).i; }
function positionOf(c) {
  var pos = 1;
  for (var i = 0; i < cars.length; i++) if (cars[i] !== c && progress(cars[i]) > progress(c)) pos++;
  return pos;
}
function fmtT(t) {
  var m = Math.floor(t / 60), s = (t % 60).toFixed(2);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// ---------- 主更新 ----------
function update(dt) {
  if (state !== 'race') return;
  raceT += dt;
  if (startLights > 0) { startLights -= dt; return; }

  for (var i = 0; i < cars.length; i++) {
    var c = cars[i];
    if (c.finished) { c.speed *= (1 - dt * 0.8); }
    if (c.team === 0) { c.slipFrom = slipCheck(c); c.slip = !!c.slipFrom; stepCar(c, dt, true); }
    else { c.slipFrom = slipCheck(c); c.slip = !!c.slipFrom; aiDrive(c, dt); stepCar(c, dt, false); }   // AI 也能吃尾流
  }
  carCollide(dt);
  stepSparks(dt);
  stepWinds(dt);
  camFollow(cars[0], dt);
  engineTick(cars[0] ? cars[0].speed : 0);

  if (cars[0] && cars[0].finished) { state = 'over'; engineStop(); beep(660, 0.2, 0.07); }
}

// ---------- 绘制 ----------
function drawTrack() {
  ctx.fillStyle = '#24501f';                           // 草地（跟着镜头铺满视野）
  ctx.fillRect(cam.x - 40, cam.y - 40, W + 80, H + 80);
  // 草地斜纹（世界坐标，不跟镜头滑动的错觉就消失）
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
  var gy0 = Math.floor((cam.y - 40) / 36) * 36;
  for (var y = gy0; y < cam.y + H + 40; y += 36) {
    ctx.beginPath(); ctx.moveTo(cam.x - 40, y); ctx.lineTo(cam.x + W + 40, y); ctx.stroke();
  }
  // 白边 + 沥青
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = ROAD_HALF * 2 + 10;
  ctx.beginPath();
  ctx.moveTo(TRACK[0][0], TRACK[0][1]);
  for (var i = 1; i < SEGN; i++) ctx.lineTo(TRACK[i][0], TRACK[i][1]);
  ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = '#3a3f45'; ctx.lineWidth = ROAD_HALF * 2;
  ctx.beginPath();
  ctx.moveTo(TRACK[0][0], TRACK[0][1]);
  for (i = 1; i < SEGN; i++) ctx.lineTo(TRACK[i][0], TRACK[i][1]);
  ctx.closePath(); ctx.stroke();

  // 弯心香肠路肩：沿每条弯的内侧沥青边缘整段铺（连续同向弯算一条弯）
  drawKerbs();
  // 起点黑白格（横在主直道上，跟赛道方向走）
  ctx.save();
  ctx.translate(SEG0OX + SEG0X * START_S, SEG0OY + SEG0Y * START_S);
  ctx.rotate(Math.atan2(SEG0Y, SEG0X));
  for (var gx = 0; gx < 4; gx++) for (var gy = 0; gy < 8; gy++) {
    ctx.fillStyle = (gx + gy) % 2 ? '#111' : '#fff';
    ctx.fillRect(-8 + gx * 4, -ROAD_HALF + gy * (ROAD_HALF * 2 / 8), 4, ROAD_HALF * 2 / 8);
  }
  ctx.restore();
}
function drawCar(c) {
  var T = TEAMS[c.team];
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.angle); ctx.scale(1.7, 1.7);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 10, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#14181e';
  ctx.fillRect(-14, -11, 8, 6); ctx.fillRect(-14, 5, 8, 6);
  ctx.fillRect(7, -10, 7, 5);  ctx.fillRect(7, 5, 7, 5);
  ctx.fillStyle = T.wing;
  ctx.fillRect(-17, -9, 4, 18);
  ctx.fillStyle = T.body;
  ctx.fillRect(-17, -11, 4, 3); ctx.fillRect(-17, 8, 4, 3);
  ctx.fillRect(-13, -6, 22, 12);
  ctx.fillStyle = T.wing;
  ctx.fillRect(-13, -2.5, 15, 5);
  ctx.fillStyle = T.body;
  ctx.beginPath(); ctx.moveTo(9, -4); ctx.lineTo(21, -1.5); ctx.lineTo(21, 1.5); ctx.lineTo(9, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = T.wing;
  ctx.fillRect(20, -9, 3.5, 18);
  ctx.fillStyle = '#0d1117';
  ctx.beginPath(); ctx.ellipse(-3, 0, 5, 4, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c8ccd2'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(-3, 0, 6.2, 5.2, 0, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(-13, -1, 22, 2);
  ctx.restore();
  if (c.team === 0) {
    ctx.fillStyle = '#ffe14d';
    ctx.beginPath();
    ctx.moveTo(c.x, c.y - 26); ctx.lineTo(c.x - 7, c.y - 35); ctx.lineTo(c.x + 7, c.y - 35);
    ctx.closePath(); ctx.fill();
  }
}
function drawHUD() {
  ctx.fillStyle = 'rgba(10,14,20,0.85)'; ctx.fillRect(0, 0, W, 50);
  if (state === 'race') {                       // 镜头切换按钮（鼠标可点）
    var bx2 = W - 128, by2 = 62;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    btnPath(bx2, by2, 112, 34, 8); ctx.fill();
    ctx.fillStyle = '#c8d3de'; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('镜头：' + (camMode === 0 ? '近追' : '全景'), bx2 + 56, by2 + 18);
    ctx.textAlign = 'left';
    BTNS.push({ x: bx2, y: by2, w: 112, h: 34, fn: function () { camMode = 1 - camMode; } });
  }
  var me = cars[0];
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe14d'; ctx.font = 'bold 18px sans-serif';
  ctx.fillText('第 ' + Math.min(me.lap, TOTAL_LAPS) + ' / ' + TOTAL_LAPS + ' 圈', 18, 26);
  ctx.fillStyle = '#c8d3de'; ctx.font = 'bold 16px sans-serif';
  ctx.fillText('车速 ' + Math.round(me.speed) + ' km/h', 170, 26);
  if (me.slip) {                                   // 尾流提示
    ctx.fillStyle = '#6ee7ff';
    ctx.fillText('⚡尾流 ×1.1', 330, 26);
  }
  ctx.fillText('名次 P' + positionOf(me), 480, 26);
  ctx.textAlign = 'right';
  ctx.fillText('本圈 ' + fmtT(me.lapT), W - 190, 26);
  ctx.fillStyle = '#8fd0a8';
  ctx.fillText(me.bestLap ? '最快 ' + fmtT(me.bestLap) : '最快 --:--', W - 18, 26);
  ctx.textAlign = 'left';
}
function drawLights() {
  if (startLights <= 0) return;
  var n = Math.ceil(startLights / 0.44);
  ctx.textAlign = 'center';
  for (var i = 0; i < 5; i++) {
    ctx.fillStyle = i < n ? '#ff3b30' : 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.arc(CX - 80 + i * 40, 300, 14, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif';
  ctx.fillText('准备……', CX, 345);
}
function drawMenu() {
  ctx.fillStyle = '#121821'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 54px sans-serif';
  ctx.fillText('极速弯心', CX, 160);
  ctx.fillStyle = '#ff6b5e'; ctx.font = 'bold 24px sans-serif';
  ctx.fillText('APEX RACER · 俯视 F1', CX, 212);
  ctx.fillStyle = '#6b7a8d'; ctx.font = '16px sans-serif';
  ctx.fillText('v0.13.3', CX, 242);
  // 赛道按钮（鼠标点击选择，Q/E 也行）
  ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = '#8fa0b3';
  ctx.fillText('赛道（点击选择，Q/E 切换）', CX, 300);
  var icons = ['🐍', '🌀', '🪓'];
  var bw2 = 180, bh2 = 54;
  for (var ti = 0; ti < TRACKS.length; ti++) {
    var tx = CX - 280 + ti * 190, ty = 318;
    ctx.fillStyle = ti === trackIdx ? 'rgba(110,231,255,0.15)' : 'rgba(255,255,255,0.07)';
    btnPath(tx, ty, bw2, bh2, 10); ctx.fill();
    if (ti === trackIdx) { ctx.strokeStyle = '#6ee7ff'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = ti === trackIdx ? '#6ee7ff' : '#aab6c4';
    ctx.font = 'bold 19px sans-serif';
    ctx.fillText(icons[ti] + ' ' + TRACKS[ti].name, tx + bw2 / 2, ty + bh2 / 2 + 1);
    (function (idx) { BTNS.push({ x: tx, y: ty, w: bw2, h: bh2, fn: function () { selectTrack(idx); } }); })(ti);
  }
  // 难度按钮（鼠标点击选择）
  ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = '#8fa0b3';
  ctx.fillText('AI 难度（点击选择，A/D 切换）', CX, 425);
  var bw = 150, bh = 54;
  for (var i = 0; i < 3; i++) {
    var bx = CX - 245 + i * 170, by = 443;
    ctx.fillStyle = i === diffIdx ? 'rgba(255,225,77,0.18)' : 'rgba(255,255,255,0.07)';
    btnPath(bx, by, bw, bh, 10); ctx.fill();
    if (i === diffIdx) { ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = i === diffIdx ? '#ffe14d' : '#aab6c4';
    ctx.font = 'bold 19px sans-serif';
    ctx.fillText(DIFFAI[i].label, bx + bw / 2, by + bh / 2 + 1);
    (function (idx) { BTNS.push({ x: bx, y: by, w: bw, h: bh, fn: function () { diffIdx = idx; } }); })(i);
  }
  // 大开始按钮
  ctx.fillStyle = '#D92B2B';
  btnPath(CX - 170, 535, 340, 62, 14); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px sans-serif';
  ctx.fillText('🏁 发车（或按 Enter）', CX, 567);
  BTNS.push({ x: CX - 170, y: 535, w: 340, h: 62, fn: startRace });
  ctx.fillStyle = '#8fa0b3'; ctx.font = '16px sans-serif';
  ctx.fillText('↑/W 油门 · ↓/S 刹车 · ←→/AD 转向', CX, 655);
  ctx.fillText('出赛道会滑进草地，慢下来后自动复位 · 跟住前车尾部吃尾流可提速超车 · V 切换镜头', CX, 685);
}
function drawOver() {
  var me = cars[0];
  ctx.fillStyle = 'rgba(10,14,20,0.82)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  var pos = positionOf(me);
  ctx.fillStyle = pos === 1 ? '#ffe14d' : '#c8d3de';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText(pos === 1 ? '🏆 冠军！' : '完赛 · P' + pos, CX, 280);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px sans-serif';
  ctx.fillText('总时间 ' + fmtT(me.finishT), CX, 340);
  ctx.fillStyle = '#8fd0a8'; ctx.font = '20px sans-serif';
  ctx.fillText('最快单圈 ' + fmtT(me.bestLap), CX, 385);
  var order = cars.slice().sort(function (a, b) {
    return (b.finished ? -b.finishT : -1e9) - (a.finished ? -a.finishT : -1e9);
  });
  ctx.font = '18px sans-serif';
  for (var i = 0; i < order.length; i++) {
    ctx.fillStyle = order[i].team === 0 ? '#ffe14d' : '#aab6c4';
    ctx.fillText('P' + (i + 1) + '  ' + TEAMS[order[i].team].name +
      (order[i].finished ? '  ' + fmtT(order[i].finishT) : '  未完赛'), CX, 415 + i * 29);
  }
  ctx.fillStyle = '#9fb0c2'; ctx.font = '16px sans-serif';
  ctx.fillText('按 Enter 回主菜单', CX, 660);
}
function draw() {
  BTNS = [];
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { drawMenu(); return; }
  ctx.save();
  if (camMode === 1) {                    // 全景：拉远看全图
    var ov = overView();
    ctx.scale(ov.s, ov.s);
    ctx.translate(-ov.ox, -ov.oy);
  } else {
    ctx.translate(-cam.x, -cam.y);        // 近追：镜头跟随
  }
  drawTrack();
  drawWinds();
  if (cars[0] && cars[0].slipFrom) {                  // 尾流带：前车尾部拖着一条向后流动的低压气带
    var wo = cars[0].slipFrom;
    ctx.save();
    ctx.translate(wo.x, wo.y);
    ctx.rotate(wo.angle);
    var grad = ctx.createLinearGradient(-30, 0, -155, 0);
    grad.addColorStop(0, 'rgba(150,215,255,0.34)');
    grad.addColorStop(0.6, 'rgba(150,215,255,0.14)');
    grad.addColorStop(1, 'rgba(150,215,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-26, -28); ctx.lineTo(-160, -58); ctx.lineTo(-160, 58); ctx.lineTo(-26, 28);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3;
    for (var wi = 0; wi < 6; wi++) {                  // 气带里向后流动的空气线
      var wt = (raceT * 2.6 + wi * 0.18) % 1;
      var wx = -32 - wt * 116;
      var wy = (wi - 2.5) * 18 + Math.sin(raceT * 7 + wi * 1.7) * 4;
      ctx.strokeStyle = 'rgba(190,235,255,' + (0.7 * Math.sin(wt * Math.PI)).toFixed(2) + ')';
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx - 16 - wt * 10, wy); ctx.stroke();
    }
    ctx.restore();
  }
  for (var i = cars.length - 1; i >= 0; i--) drawCar(cars[i]);
  drawSparks();
  ctx.restore();
  drawHUD();
  drawLights();
  if (state === 'over') drawOver();
}

// ---------- 主循环 ----------
var last = performance.now();
function loop(t) {
  var dt = Math.min(0.033, (t - last) / 1000);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
