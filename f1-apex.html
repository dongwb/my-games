<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>极速弯心 APEX RACER — 俯视 F1</title>
<style>
  html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(rgba(14,19,26,0.78), rgba(14,19,26,0.78)), url('assets/stadium-bg.jpg') center/cover no-repeat fixed #141a22;}
  #wrap{position:relative;}
  canvas{width:min(96vw,calc(96vh*1.467));background:#24501f;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:block;}
  #hint{color:#7c8b9d;font-size:13px;text-align:center;margin-top:10px;letter-spacing:.5px;}
  b{color:#c8d3de;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1100" height="750"></canvas>
  <div id="hint"><b>↑/W</b> 油门 · <b>↓/S</b> 刹车 · <b>←→/AD</b> 转向 · <b>V</b> 镜头 · 菜单 <b>Q/E</b> 选赛道 <b>A/D</b> 选难度</div>
</div>
<script>
/* ============================================================
   极速弯心 APEX RACER · v0.11.0
   俯视 F1：三条特色赛道（放大版）+ 向量物理 + 尾流超车
   v0.10.0：赛道库（眼镜蛇/漩涡/战斧）/ AI 赛车线 / 路肩贴弯内缘 /
          尾流 ×1.1 / 修 V 键
   v0.11.0：赛道整体放大 ×1.55（一圈 30 多秒）/ 路肩系统重写——
          连续同向弯算一条弯，沿内侧沥青边缘整段铺（治漩涡乱码）/
          尾流存在感加强：更亮的气带 + 车身脉冲光圈 + 进尾流提示音
   ============================================================ */

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 1100, H = 750, CX = W / 2, CY = H / 2;

// ---------- 赛道库 ----------
// 每条赛道约定：pts[0]→pts[1] 是主直道（行进方向），startS = 起点线距 pts[0] 的沿道距离
var TRACKS = [
  { name:'眼镜蛇', en:'COBRA', startS:400, pts:[
    [300,1150],[1500,1150],                                // 主直道（起终点）
    [1690,1120],[1800,1035],[1750,930],[1600,905],         // T1 大发卡（右，180° 掉头）
    [1450,905],                                            // 出卡短直道
    [1310,850],[1190,920],[1070,835],[1000,720],           // 连续 S 弯（左右左）
    [960,580],[955,450],[990,330],                         // 全速扫弯（向北）
    [900,225],[765,185],[640,265],[590,400],               // 之字减速弯
    [580,540],[600,700],                                   // 后直道（向南）
    [575,840],[480,945],[350,1000],[215,1070],[170,1150]   // 最后连续弯 + 紧收尾
  ] },
  { name:'漩涡', en:'VORTEX', startS:400, pts:[
    [250,1080],[1350,1080],                                // 主直道
    [1530,1040],[1650,900],[1690,720],[1650,560],          // 大弧度右扫弯（全速）
    [1560,430],[1410,360],[1260,380],                      // 顶部左弯
    [1130,480],[1090,610],[1140,730],                      // 螺旋收拢（半径越收越小）
    [1010,800],[860,790],                                  // 出螺旋短直道
    [720,720],[700,580],[780,470],                         // 内钩之字
    [720,340],[580,280],[450,320],                         // 左上组合弯
    [330,430],[280,600],[300,780],                         // 左侧长左弯
    [240,920],[230,1040]                                   // 收尾回主直道
  ] },
  { name:'战斧', en:'TOMAHAWK', startS:400, pts:[
    [300,1120],[1200,1120],                                // 主直道（短）
    [1360,1090],[1460,980],[1440,840],                     // T1-T2 右弯组
    [1520,700],[1640,640],[1690,520],                      // 加速上山弯
    [1700,350],[1620,240],[1470,230],[1380,330],[1330,470],// 山顶双顶点发卡
    [1240,600],[1150,720],[1010,770],                      // 下切进内场
    [860,740],[790,620],[830,480],                         // 内场 S 弯
    [730,370],[590,320],[460,370],                         // 左上弯组
    [360,490],[330,660],[370,820],                         // 左侧下行
    [310,950],[270,1070]                                   // 收尾回主直道
  ] }
];
var trackIdx = 0;
var TRACK, SEGN;
var ROAD_HALF = 84;
var TRACK_SCALE = 2.0;     // 赛道整体放大倍数（一圈 30 多秒）
var START_S = 400;          // 起点线在主直道上距 pts[0] 的沿道距离（放大后）
var TOTAL_LAPS = 5;

// 赛道边界（镜头限制用）+ 主直道方向（压线判定/发车格用）
var BD = { x0: 0, y0: 0, x1: 0, y1: 0 };
var SEG0X = 1, SEG0Y = 0, SEG0OX = 0, SEG0OY = 0;
function selectTrack(k) {
  trackIdx = ((k % TRACKS.length) + TRACKS.length) % TRACKS.length;
  var raw = TRACKS[trackIdx].pts;
  // 绕重心整体放大（弯的相对形状不变，路面宽度不变 → 弯相对更"宽"更好开）
  var ccx = 0, ccy = 0;
  for (var ci = 0; ci < raw.length; ci++) { ccx += raw[ci][0]; ccy += raw[ci][1]; }
  ccx /= raw.length; ccy /= raw.length;
  TRACK = [];
  for (ci = 0; ci < raw.length; ci++) {
    TRACK.push([Math.round(ccx + (raw[ci][0] - ccx) * TRACK_SCALE),
                Math.round(ccy + (raw[ci][1] - ccy) * TRACK_SCALE)]);
  }
  SEGN = TRACK.length;
  START_S = TRACKS[trackIdx].startS * TRACK_SCALE;
  BD = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
  for (var bi = 0; bi < SEGN; bi++) {
    BD.x0 = Math.min(BD.x0, TRACK[bi][0]); BD.x1 = Math.max(BD.x1, TRACK[bi][0]);
    BD.y0 = Math.min(BD.y0, TRACK[bi][1]); BD.y1 = Math.max(BD.y1, TRACK[bi][1]);
  }
  var MARGIN = 300;
  BD.x0 -= MARGIN; BD.y0 -= MARGIN; BD.x1 += MARGIN; BD.y1 += MARGIN;
  SEG0OX = TRACK[0][0]; SEG0OY = TRACK[0][1];
  var dx = TRACK[1][0] - SEG0OX, dy = TRACK[1][1] - SEG0OY;
  var dm = Math.sqrt(dx*dx + dy*dy) || 1;
  SEG0X = dx / dm; SEG0Y = dy / dm;
}
selectTrack(0);

// ---------- 镜头（0=近追 1=全景，按 V 切换） ----------
var cam = { x: 0, y: 0 };
var camMode = 0;
function overView() {                              // 全景视角的缩放+居中参数
  var s = Math.min(W / (BD.x1 - BD.x0), H / (BD.y1 - BD.y0)) * 0.98;
  return { s: s, ox: (BD.x0 + BD.x1) / 2 - W / 2 / s, oy: (BD.y0 + BD.y1) / 2 - H / 2 / s };
}
function camFollow(c, dt) {
  var tx = c.x - W / 2, ty = c.y - H / 2;
  cam.x += (tx - cam.x) * Math.min(1, dt * 5);
  cam.y += (ty - cam.y) * Math.min(1, dt * 5);
  cam.x = Math.max(BD.x0, Math.min(BD.x1 - W, cam.x));
  cam.y = Math.max(BD.y0, Math.min(BD.y1 - H, cam.y));
}

// 点到线段距离
function segDist(px, py, a, b) {
  var vx = b[0]-a[0], vy = b[1]-a[1];
  var t = ((px-a[0])*vx + (py-a[1])*vy) / (vx*vx+vy*vy);
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  var dx = px - (a[0]+vx*t), dy = py - (a[1]+vy*t);
  return Math.sqrt(dx*dx + dy*dy);
}
function nearestSeg(px, py) {
  var bi = 0, bd = 1e9;
  for (var i = 0; i < SEGN; i++) {
    var d = segDist(px, py, TRACK[i], TRACK[(i+1) % SEGN]);
    if (d < bd) { bd = d; bi = i; }
  }
  return { i: bi, d: bd };
}
function nearestPt(px, py) {
  var bx = 0, by = 0, bd = 1e9;
  for (var i = 0; i < SEGN; i++) {
    var a = TRACK[i], b = TRACK[(i+1) % SEGN];
    var vx = b[0]-a[0], vy = b[1]-a[1];
    var t = ((px-a[0])*vx + (py-a[1])*vy) / (vx*vx+vy*vy);
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var x = a[0]+vx*t, y = a[1]+vy*t;
    var d = (px-x)*(px-x) + (py-y)*(py-y);
    if (d < bd) { bd = d; bx = x; by = y; }
  }
  return { x: bx, y: by };
}

// ---------- 音效 ----------
var AC = null, engO = null, engG = null;
function ac() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  return AC;
}
function engineStart() {
  var a = ac(); if (!a || engO) return;
  engO = a.createOscillator(); engG = a.createGain();
  engO.type = 'sawtooth'; engO.frequency.value = 70;
  engG.gain.value = 0.028;
  engO.connect(engG); engG.connect(a.destination); engO.start();
}
function engineStop() { if (engO) { try { engO.stop(); } catch(e){} engO = null; } }
function engineTick(sp) { if (engO && AC) engO.frequency.setValueAtTime(70 + sp * 0.85, AC.currentTime); }
function beep(f, dur, vol) {
  var a = ac(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.frequency.value = f; o.type = 'square';
    g.gain.setValueAtTime(vol || 0.05, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  } catch (e) {}
}
function thud() {   // 金属撞击
  var a = ac(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(1800, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, a.currentTime + 0.06);
    g.gain.setValueAtTime(0.07, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.07);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.08);
  } catch (e) {}
}

// ---------- AI 难度 ----------
var DIFFAI = [
  { label:'🐣 简单', skill: -0.14, acc: 0.8 },
  { label:'😊 中等', skill: 0,     acc: 1.0 },
  { label:'😈 困难', skill: 0.10,  acc: 1.15 }
];
var diffIdx = 1;

// ---------- 赛车 ----------
var TEAMS = [
  { name:'你',   body:'#D92B2B', wing:'#1a1a1a' },
  { name:'蓝队', body:'#2456C8', wing:'#101828' },
  { name:'橙队', body:'#E88020', wing:'#202020' },
  { name:'绿队', body:'#1F9E58', wing:'#181818' }
];
var cars = [];
function mkCar(i, gx, gy) {
  return {
    team: i, x: gx, y: gy, angle: 0, speed: 0, latS: 0,
    lap: 0, lastSeg: SEGN - 2, lapT: 0, bestLap: 0,
    aiSkill: 0.97 + i * 0.035, finished: false, finishT: 0,
    offT: 0, rejoinX: 0, rejoinY: 0, prevX: gx, prevY: gy
  };
}
var state = 'menu';
var raceT = 0, startLights = 0;

function startRace() {
  cars = [];
  var offs = [[-60,-28],[-115,28],[-170,-28],[-225,28]];   // 发车格（相对起点线：沿道后退/横向交错）
  var nx = -SEG0Y, ny = SEG0X;
  for (var i = 0; i < 4; i++) {
    var s = START_S + offs[i][0], l = offs[i][1];
    var c = mkCar(i, SEG0OX + SEG0X*s + nx*l, SEG0OY + SEG0Y*s + ny*l);
    c.angle = Math.atan2(SEG0Y, SEG0X);
    cars.push(c);
  }
  raceT = 0; startLights = 2.2; sparks = [];
  state = 'race';
  engineStart();
}

// ---------- 按键 ----------
var KEYS = {};
addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k) >= 0) e.preventDefault();
  if (e.repeat) return;
  KEYS[k] = true;
  if (state === 'menu') {
    if (k === 'a' || k === 'arrowleft')  diffIdx = (diffIdx + 2) % 3;
    if (k === 'd' || k === 'arrowright') diffIdx = (diffIdx + 1) % 3;
    if (k === 'q') selectTrack(trackIdx + 2);
    if (k === 'e') selectTrack(trackIdx + 1);
    if (k === 'enter') startRace();
  } else if (state === 'race') {
    if (k === 'v') camMode = 1 - camMode;            // 比赛中 V 切镜头
  } else if (state === 'over') {
    if (k === 'enter') state = 'menu';
  }
});
addEventListener('keyup', function (e) { KEYS[e.key.toLowerCase()] = false; });
// 屏幕按钮（鼠标可点）
var BTNS = [];
function btnPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
cv.addEventListener('click', function (e) {
  var r = cv.getBoundingClientRect();
  var x = (e.clientX - r.left) * (cv.width / r.width);
  var y = (e.clientY - r.top) * (cv.height / r.height);
  for (var i = 0; i < BTNS.length; i++) {
    var b = BTNS[i];
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); break; }
  }
});
function kL() { return KEYS['arrowleft'] || KEYS['a']; }
function kR() { return KEYS['arrowright'] || KEYS['d']; }
function kU() { return KEYS['arrowup'] || KEYS['w']; }
function kD() { return KEYS['arrowdown'] || KEYS['s']; }

// ---------- 物理（向量模型：纵向油门 + 横向抓地甩尾） ----------
function stepCar(c, dt, isPlayer) {
  c.prevX = c.x; c.prevY = c.y;              // 本帧起始位置（压线判定用）
  var ns = nearestSeg(c.x, c.y);
  var onRoad = ns.d < ROAD_HALF + 8;

  if (isPlayer) {
    if (kU()) c.speed += (onRoad ? (c.slip ? 170 : 150) : 45) * dt;   // 草地上油门没劲（速度才降得下来）
    if (kD()) c.speed -= 430 * dt;                   // F1 刹车很猛
  }
  c.speed -= c.speed * 0.22 * dt;
  var cap = c.slip ? 363 : 330;                      // 尾流里极速 ×1.1
  if (c.speed > cap) c.speed -= (c.speed - cap) * 2.5 * dt + 30 * dt;
  if (c.speed < 0) c.speed = 0;

  var steer = 0;
  if (isPlayer) { if (kL()) steer -= 1; if (kR()) steer += 1; }
  var steerRate = 3.0 - Math.min(c.speed / 330, 1) * 1.1;
  var dA = steer * steerRate * dt;
  c.angle += dA;
  if (steer) c.speed -= c.speed * 0.32 * dt;         // 打方向自带一点刹车（循迹感）
  c.latS += steer * c.speed * dA * 0.9;              // 离心把车身往外甩
  c.latS -= c.latS * Math.min(1, (onRoad ? 9 : 3.2) * dt);

  var fx = Math.cos(c.angle), fy = Math.sin(c.angle);
  c.x += (fx * c.speed - fy * c.latS) * dt;
  c.y += (fy * c.speed + fx * c.latS) * dt;

  // —— 冲出赛道（草地）：先顺势滑、速度缓慢降下来；然后复位到出草地前的位置 ——
  if (!onRoad) {
    if (c.offT === 0) {
      var rp = nearestPt(c.x, c.y);
      c.rejoinX = rp.x; c.rejoinY = rp.y;
    }
    c.offT += dt;
    c.speed *= (1 - dt * 1.6);
    c.latS *= (1 - dt * 2);
    if (c.speed > 150) c.speed -= (c.speed - 150) * 1.5 * dt;
    if (c.speed < 60 || c.offT > 2.2) {              // 慢下来或超时就复位
      c.x = c.rejoinX; c.y = c.rejoinY;
      var sg = nearestSeg(c.x, c.y);
      var a2 = TRACK[sg.i], b2 = TRACK[(sg.i+1) % SEGN];
      c.angle = Math.atan2(b2[1] - a2[1], b2[0] - a2[0]);
      c.speed = 0; c.latS = 0; c.offT = 0;
      beep(440, 0.12, 0.05);
    }
  } else c.offT = 0;

  // 圈数：真的压过起点线才算（沿主直道方向的投影跨过起点线），不再提前一车位弹提示
  var sPrev = (c.prevX - SEG0OX) * SEG0X + (c.prevY - SEG0OY) * SEG0Y;
  var sNow  = (c.x - SEG0OX) * SEG0X + (c.y - SEG0OY) * SEG0Y;
  if (ns.i === 0 && sPrev < START_S && sNow >= START_S && c.speed > 40 && c.lapT > 8) {
    if (c.lap > 0) {
      if (!c.bestLap || c.lapT < c.bestLap) c.bestLap = c.lapT;
      if (c.team === 0) beep(880, 0.15, 0.06);
    }
    c.lap++;
    c.lapT = 0;
    c.lastSeg = ns.i;
    if (c.lap > TOTAL_LAPS && !c.finished) { c.finished = true; c.finishT = raceT; }
  } else if (ns.i > 2) {
    c.lastSeg = ns.i;
  }
  c.lapT += dt;
}

// ---------- AI：纯追踪走线 + 提前扫描刹车 + 难度系数 ----------
function nearestOnTrack(px, py) {
  var bi = 0, bt = 0, bd = 1e9;
  for (var i = 0; i < SEGN; i++) {
    var a = TRACK[i], b = TRACK[(i+1) % SEGN];
    var vx = b[0]-a[0], vy = b[1]-a[1];
    var t = ((px-a[0])*vx + (py-a[1])*vy) / (vx*vx+vy*vy);
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var x = a[0]+vx*t, y = a[1]+vy*t;
    var d = (px-x)*(px-x) + (py-y)*(py-y);
    if (d < bd) { bd = d; bi = i; bt = t; }
  }
  return { i: bi, t: bt, d: Math.sqrt(bd) };
}
function turnAt(j) {   // 顶点 j 的弯度：0 = 笔直，2 = 原地掉头
  var a = TRACK[(j+SEGN-1) % SEGN], b = TRACK[j], d = TRACK[(j+1) % SEGN];
  var v1x = b[0]-a[0], v1y = b[1]-a[1], v2x = d[0]-b[0], v2y = d[1]-b[1];
  var m1 = Math.sqrt(v1x*v1x+v1y*v1y) || 1, m2 = Math.sqrt(v2x*v2x+v2y*v2y) || 1;
  return 1 - (v1x*v2x + v1y*v2y) / (m1*m2);
}
function insideDir(j) {   // 顶点 j 弯内侧的单位方向（路肩和赛车线都用它）
  var a = TRACK[(j+SEGN-1) % SEGN], b = TRACK[j], d = TRACK[(j+1) % SEGN];
  var v1x = b[0]-a[0], v1y = b[1]-a[1], v2x = d[0]-b[0], v2y = d[1]-b[1];
  var m1 = Math.sqrt(v1x*v1x+v1y*v1y) || 1, m2 = Math.sqrt(v2x*v2x+v2y*v2y) || 1;
  var ix = v2x/m2 - v1x/m1, iy = v2y/m2 - v1y/m1;
  var im = Math.sqrt(ix*ix + iy*iy) || 1;
  return [ix/im, iy/im];
}
function crossAt(j) {   // 顶点 j 的转向（符号 = 左/右）
  var a = TRACK[(j+SEGN-1) % SEGN], b = TRACK[j], d = TRACK[(j+1) % SEGN];
  return (b[0]-a[0])*(d[1]-b[1]) - (b[1]-a[1])*(d[0]-b[0]);
}

// ---------- 路肩：连续同向弯算"一条弯"，沿内侧沥青边缘整段铺香肠 ----------
function drawKerbRun(vs, ve) {
  // 路径点列：入口 55px 前 → vs..ve 各顶点 → 出口 55px 后
  var pts = [];
  var a0 = TRACK[(vs+SEGN-1) % SEGN], b0 = TRACK[vs];
  var d0x = b0[0]-a0[0], d0y = b0[1]-a0[1], m0 = Math.sqrt(d0x*d0x+d0y*d0y) || 1;
  pts.push([b0[0] - d0x/m0*55, b0[1] - d0y/m0*55]);
  for (var v = vs; ; v = (v+1) % SEGN) {
    pts.push(TRACK[v]);
    if (v === ve) break;
  }
  var a1 = TRACK[ve], b1 = TRACK[(ve+1) % SEGN];
  var d1x = b1[0]-a1[0], d1y = b1[1]-a1[1], m1 = Math.sqrt(d1x*d1x+d1y*d1y) || 1;
  pts.push([a1[0] + d1x/m1*55, a1[1] + d1y/m1*55]);
  // 内侧方向取全弯最急顶点的
  var sharp = vs, st = 0;
  for (v = vs; ; v = (v+1) % SEGN) {

// ---------- 火花粒子 ----------

// ---------- 车碰车：法线冲量 + 甩头震动 + 火花 ----------

  ctx.fillStyle = '#8fa0b3'; ctx.font = '16px sans-serif';
  ctx.fillText('↑/W 油门 · ↓/S 刹车 · ←→/AD 转向', CX, 655);
  ctx.fillText('出赛道会滑进草地，慢下来后自动复位 · 跟住前车尾部吃尾流可提速超车 · V 切换镜头', CX, 685);
}
function drawOver() {
  var me = cars[0];
  ctx.fillStyle = 'rgba(10,14,20,0.82)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  var pos = positionOf(me);
  ctx.fillStyle = pos === 1 ? '#ffe14d' : '#c8d3de';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText(pos === 1 ? '🏆 冠军！' : '完赛 · P' + pos, CX, 280);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px sans-serif';
  ctx.fillText('总时间 ' + fmtT(me.finishT), CX, 340);
  ctx.fillStyle = '#8fd0a8'; ctx.font = '20px sans-serif';
  ctx.fillText('最快单圈 ' + fmtT(me.bestLap), CX, 385);
  var order = cars.slice().sort(function (a, b) {
    return (b.finished ? -b.finishT : -1e9) - (a.finished ? -a.finishT : -1e9);
  });
  ctx.font = '18px sans-serif';
  for (var i = 0; i < order.length; i++) {
    ctx.fillStyle = order[i].team === 0 ? '#ffe14d' : '#aab6c4';
    ctx.fillText('P' + (i + 1) + '  ' + TEAMS[order[i].team].name +
      (order[i].finished ? '  ' + fmtT(order[i].finishT) : '  未完赛'), CX, 440 + i * 34);
  }
  ctx.fillStyle = '#9fb0c2'; ctx.font = '16px sans-serif';
  ctx.fillText('按 Enter 回主菜单', CX, 640);
}
function draw() {
  BTNS = [];
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { drawMenu(); return; }
  ctx.save();
  if (camMode === 1) {                    // 全景：拉远看全图
    var ov = overView();
    ctx.scale(ov.s, ov.s);
    ctx.translate(-ov.ox, -ov.oy);
  } else {
    ctx.translate(-cam.x, -cam.y);        // 近追：镜头跟随
  }
  drawTrack();
  if (cars[0] && cars[0].slipFrom) {                  // 尾流带：前车尾部拖着一条向后流动的低压气带
    var wo = cars[0].slipFrom;
    ctx.save();
    ctx.translate(wo.x, wo.y);
    ctx.rotate(wo.angle);
    var grad = ctx.createLinearGradient(-30, 0, -155, 0);
    grad.addColorStop(0, 'rgba(150,215,255,0.34)');
    grad.addColorStop(0.6, 'rgba(150,215,255,0.14)');
    grad.addColorStop(1, 'rgba(150,215,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-26, -24); ctx.lineTo(-155, -38); ctx.lineTo(-155, 38); ctx.lineTo(-26, 24);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3;
    for (var wi = 0; wi < 6; wi++) {                  // 气带里向后流动的空气线
      var wt = (raceT * 2.6 + wi * 0.18) % 1;
      var wx = -32 - wt * 116;
      var wy = (wi - 2.5) * 12 + Math.sin(raceT * 7 + wi * 1.7) * 3;
      ctx.strokeStyle = 'rgba(190,235,255,' + (0.7 * Math.sin(wt * Math.PI)).toFixed(2) + ')';
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx - 16 - wt * 10, wy); ctx.stroke();
    }
    ctx.restore();
    // 玩家车身脉冲光圈：一眼知道自己正在吃尾流
    var pr = 36 + Math.sin(raceT * 10) * 5;
    ctx.strokeStyle = 'rgba(110,231,255,0.8)'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(cars[0].x, cars[0].y, pr, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(110,231,255,0.3)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(cars[0].x, cars[0].y, pr + 5, 0, 7); ctx.stroke();
  }
  for (var i = cars.length - 1; i >= 0; i--) drawCar(cars[i]);
  drawSparks();
  ctx.restore();
  drawHUD();
  drawLights();
  if (state === 'over') drawOver();
}

// ---------- 主循环 ----------
var last = performance.now();
function loop(t) {
  var dt = Math.min(0.033, (t - last) / 1000);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
