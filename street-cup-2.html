<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>街头萌战 2 STREET CUP 2 — 阿根廷 vs 西班牙</title>
<style>
  html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(rgba(14,19,26,0.74), rgba(14,19,26,0.74)), url('assets/street-bg.jpg') center/cover no-repeat fixed #141a22;}
  #wrap{position:relative;}
  canvas{width:min(96vw,calc(96vh*0.75));background:#1d2733;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:block;}
  #hint{color:#7c8b9d;font-size:13px;text-align:center;margin-top:10px;letter-spacing:.5px;}
  b{color:#c8d3de;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1080" height="1440"></canvas>
  <div id="hint">5v5 · 主菜单：<b>A</b> 阿根廷 / <b>S</b> 西班牙 · <b>Enter</b> 开球 &nbsp;|&nbsp; 比赛中：<b>方向键/WASD</b> 跑动 · <b>空格</b> 传球/射门 · 过半场<b>按住空格</b>蓄力射门</div>
</div>
<script>
/* ============================================================
   街头萌战 2 STREET CUP 2 · v2.3.1
   5v5（1 门将 + 4 场上球员：2 后卫 + 2 前锋）· 场地×2
   基于初代里程碑 v1.2.0：AI 大脑 / 蓄力射门 / 门将扑救 全部继承
   v2.1.0：角色分工——后卫守家（不过中线/左右固定/反击回追），
          前锋不抢球，中圈等反击
   v2.1.1：修开球前锋站桩——球在中圈/对方半场无主时前锋要去抢
   v2.2.0：队魂 AI——阿根廷防反（深防线/长传找前锋/前锋压上），
          西班牙控球（小三角短传/高压倒脚/防线前压）
   v2.2.1：修选西班牙时比分记反——进球按队伍编号映射到"你/AI"
   v2.2.2：修门将死循环——对方不再堵门（回去防守）/ 大脚改开边路
   v2.3.0：赛后技术统计——比分/控球率/传球/射门/扑救 五维表格
   v2.3.1：修真·堵门（回防公式用错把人推向球）/ 门将传球前查线路
   ============================================================ */

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 1080, H = 1440, CX = 540;

// ---------- 球场 ----------
var LX = 85, RX = 995, TY = 120, BY = 1268;
var GOAL_HALF = 120;
var BOX_HALF = 170;            // 禁区半宽
var BOX_DEPTH = 165;           // 禁区进深
var GK_SPEED_F = 0.75;         // 门将移动速度 = 球员速度(215) × 0.75
var GK_REACH = 10;             // 门将手套够得着的余量（别太大，否则像磁吸）

// ---------- 队伍数据 ----------
var TEAMS = [
  { id:'ARG', name:'阿根廷', jersey:'#FFFFFF', stripe:'#75AADB', collar:'#0C2340',
    shorts:'#0C2340', socks:'#75AADB', gk:'#22c3ac' },
  { id:'ESP', name:'西班牙', jersey:'#AA151B', stripe:'#F1BF00', collar:'#0C2340',
    shorts:'#0C2340', socks:'#AA151B', gk:'#ffad1f' }
];

// ---------- 队魂：两队同骨架，风格参数分叉 ----------
// pressD=被逼多近才传 shotR=AI起脚距离 supportK=接应距离系数
// waitY=前锋等反击的纵深(+靠后/-压上) defDepth=防线纵深区间 outletFwd=开球找前锋加成
var SOUL = [
  { pressD: 50, shotR: 430, supportK: 1.0,  waitY: -90, defDepth: [0.18, 0.55], outletFwd: 120 },  // 阿根廷：防反
  { pressD: 88, shotR: 350, supportK: 0.72, waitY: 60,  defDepth: [0.35, 0.85], outletFwd: 0 }     // 西班牙：控球
];

// ---------- 状态 ----------
var state = 'menu';            // menu | kickoff | play | over
var pickIdx = 0;               // 玩家队
var players = [], ball = null;
var scores = [0, 0];           // [玩家队, AI队]
var clock = 120, goalFlash = 0, goalSide = -1, goalTeam = -1, readyT = 0;
var winner = null;
var ctrl = null;               // 本帧玩家真正操控的人
var ctrlAge = 99;              // 距上次换人过了几秒（防频繁切换）
var preferCtrl = null;         // 传球瞬间锁定的接球人（短暂优先操控他）
var preferT = 0;               // preferCtrl 的有效倒计时
var prevSpace = false;         // 空格按下沿检测
var charging = false;          // 正在蓄力射门
var charge = 0;                // 蓄力进度 0~1（1 秒蓄满）
var lastKickTeam = -1;         // 球最后是被哪一队踢的（传球/射门归属）
var stats = null;                // 全场技术统计：传球/射门/扑救/控球时长

// ---------- 按键 ----------
var KEYS = {};
addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if ([' ', 'arrowup','arrowdown','arrowleft','arrowright'].indexOf(k) >= 0) e.preventDefault();
  if (e.repeat) return;
  KEYS[k] = true;
  if (state === 'menu') {
    if (k === 'a') pickIdx = 0;
    if (k === 's') pickIdx = 1;
    if (k === 'enter') { snd('whistle', 0.18, 1.0); startMatch(); }
  } else if (state === 'over') {
    if (k === ' ' || k === 'enter') { state = 'menu'; scores = [0, 0]; }
  }
});
addEventListener('keyup', function (e) { KEYS[e.key.toLowerCase()] = false; });

// ---------- 音效 ----------
var AC = null;
function snd(type, dur, f, f2, vol) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f || 220, AC.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.045, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur + 0.02);
  } catch (e) {}
}
function kickSfx() { snd('square', 0.07, 320, 220); }
function goalSfx()  { snd('square', 0.12, 520, 660); setTimeout(function(){ snd('square', 0.16, 784, 988); }, 120); }

// ---------- 数学工具 ----------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function dist2(x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; }
function vlen(x, y) { return Math.sqrt(x * x + y * y); }
function enemyGoalOf(team) { return { x: CX, y: team === 0 ? TY : BY }; }
function myGoalOf(team)    { return { x: CX, y: team === 0 ? BY : TY }; }

// 某队防守的小禁区（贴本方球门那片）
function boxOf(team) {
  var gy = team === 0 ? BY : TY;
  var s  = team === 0 ? -1 : 1;                 // 从门线指向场内的方向
  var loY = Math.min(gy, gy + s * BOX_DEPTH);
  var hiY = Math.max(gy, gy + s * BOX_DEPTH);
  return { team: team, x0: CX - BOX_HALF, x1: CX + BOX_HALF, gy: gy, s: s, loY: loY, hiY: hiY };
}

// ---------- 建队 ----------
function mkPlayer(team, slot) {
  var isGK = slot === 2;                         // 槽位 2 = 门将；0/1 后卫，3/4 前锋
  var x = CX, y;
  if (isGK)          { y = team === 0 ? BY - 60 : TY + 60; }
  else if (slot < 2) { x = CX + (slot === 0 ? -150 : 150); y = team === 0 ? BY - 280 : TY + 280; }
  else               { x = CX + (slot === 3 ? -130 : 130); y = team === 0 ? BY - 520 : TY + 520; }
  return {
    team: team, slot: slot, isGK: isGK,
    x: x, y: y, vx: 0, vy: 0,
    r: isGK ? 16 : 15,
    face: { x: 0, y: team === 0 ? -1 : 1 },
    blink: Math.random() * 4, bob: 0, moving: false,
    gkHold: 0, diveT: 0, diveDir: 0
  };
}
function newStats() { return [{ pass: 0, shot: 0, save: 0, poss: 0 }, { pass: 0, shot: 0, save: 0, poss: 0 }]; }
function startMatch() {
  scores = [0, 0]; clock = 120; winner = null; lastKickTeam = -1;
  stats = newStats();
  chaserOf = [null, null]; ctrlAge = 99;
  players = [];
  ball = { x: CX, y: (TY + BY) / 2, vx: 0, vy: 0, r: 9, owner: null, free: 0 };
  for (var s = 0; s < 5; s++) {
    players.push(mkPlayer(0, s));               // 玩家队，守下方门
    players.push(mkPlayer(1, s));               // AI 队，守上方门
  }
  setupPositions();
  state = 'kickoff'; readyT = 1.2; goalFlash = 0;
}
// 中圈开球站位
function setupPositions() {
  ball.x = CX; ball.y = (TY + BY) / 2; ball.vx = ball.vy = 0; ball.owner = null; ball.free = 0;
  lastKickTeam = -1;
  preferCtrl = null; preferT = 0;
  charging = false; charge = 0;
  var cy = (TY + BY) / 2;
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.isGK) {
      p.x = CX; p.y = p.team === 0 ? BY - 34 : TY + 34;   // 门将守在门口
    } else {
      var dir = p.team === 0 ? 1 : -1;                     // 队0 守下方
      if (p.slot < 2) {                                    // 后卫拖后
        p.x = CX + (p.slot === 0 ? -170 : 170);
        p.y = cy + dir * 300;
      } else {                                             // 前锋靠前，准备开球冲刺
        p.x = CX + (p.slot === 3 ? -140 : 140);
        p.y = cy + dir * 110;
      }
    }
    p.vx = p.vy = 0; p.gkHold = 0; p.diveT = 0;
    p.face.x = 0; p.face.y = p.team === 0 ? -1 : 1;
    // 倒计时阶段把箭头交给玩家队左前锋，开球即冲刺
    if (p.team === pickIdx && !p.isGK && p.slot === 3) ctrl = p;
  }
}

// ---------- 玩家真正操控谁：持球=带球人；传球=锁接球人；乱战=最近的人（带迟滞不抖） ----------
function controlledPlayer() {
  if (!ball) return null;
  // 我队场上球员拿球才接管；门将拿球交给 AI 开球，不抢你控制
  if (ball.owner && ball.owner.team === pickIdx && !ball.owner.isGK) return ball.owner;
  // 刚传出去的球：优先操控接球人，可以直接迎球跑位
  if (preferCtrl && preferT > 0 && !ball.owner && preferCtrl.team === pickIdx && !preferCtrl.isGK) return preferCtrl;
  var n = nearestFieldOfTeam(ball.x, ball.y, pickIdx);
  // 迟滞：球没人拿时，除非另一个人明显更近（近 1/3 以上），否则不换人
  if (ctrl && ctrl.team === pickIdx && ctrl !== n && !ctrl.isGK) {
    if (ctrlAge < 0.35) return ctrl;           // 刚换过人，先冷静一下
    var dOld = dist2(ctrl.x, ctrl.y, ball.x, ball.y);
    var dNew = dist2(n.x, n.y, ball.x, ball.y);
    if (dNew * 1.5 > dOld) return ctrl;
  }
  return n;
}
function nearestOfTeam(x, y, team) {
  var b = null, bd = 1e9;
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.team !== team) continue;
    var d = dist2(p.x, p.y, x, y);
    if (d < bd) { bd = d; b = p; }
  }
  return b;
}
function nearestFieldOfTeam(x, y, team) {        // 场上球员（不含门将）离点最近
  var b = null, bd = 1e9;
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.team !== team || p.isGK) continue;
    var d = dist2(p.x, p.y, x, y);
    if (d < bd) { bd = d; b = p; }
  }
  return b;
}
function gkOf(team) {
  for (var i = 0; i < players.length; i++) {
    if (players[i].team === team && players[i].isGK) return players[i];
  }
  return null;
}
// 每队的逼抢人（带迟滞）：两个防守队员谁近谁抢，但一旦定了就不轻易换人，
// 否则两人距离接近时每帧互换，跑位目标左右乱跳 = 你看到的"卡顿"
var chaserOf = [null, null];
function nearestDefenderOfTeam(x, y, team) {   // 只有后卫（slot 0/1）负责抢球
  var b = null, bd = 1e9;
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.team !== team || p.isGK || p.slot >= 3) continue;
    var d = dist2(p.x, p.y, x, y);
    if (d < bd) { bd = d; b = p; }
  }
  return b;
}
function nearestForwardOfTeam(x, y, team) {   // 前锋（slot 3/4）
  var b = null, bd = 1e9;
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.team !== team || p.isGK || p.slot < 3) continue;
    var d = dist2(p.x, p.y, x, y);
    if (d < bd) { bd = d; b = p; }
  }
  return b;
}
function pickChaser(team) {
  var n = nearestDefenderOfTeam(ball.x, ball.y, team);
  var cur = chaserOf[team];
  if (cur && !cur.isGK && cur.slot < 2 && cur !== n) {
    var dOld = dist2(cur.x, cur.y, ball.x, ball.y);
    var dNew = dist2(n.x, n.y, ball.x, ball.y);
    if (dNew * 1.4 > dOld) n = cur;            // 旧逼抢人没明显更远，就继续让他抢
  }
  chaserOf[team] = n;
  return n;
}

// ---------- 人类操控 ----------
function inOpponentHalf(p) {                   // 过了半场（进入对方半场）才算
  var cy = (TY + BY) / 2;
  return p.team === 0 ? p.y < cy : p.y > cy;
}
function humanMove(p, dt) {
  // 蓄力射门时钉在原地，专心瞄准
  if (charging && ball.owner === p) {
    p.vx *= 0.8; p.vy *= 0.8; p.moving = false;
    var gg = enemyGoalOf(p.team);
    var gx = gg.x - p.x, gy2 = gg.y - p.y, gm = vlen(gx, gy2) || 1;
    p.face.x = gx / gm; p.face.y = gy2 / gm;
    return;
  }
  var dx = 0, dy = 0;
  if (KEYS['arrowleft']  || KEYS['a']) dx -= 1;
  if (KEYS['arrowright'] || KEYS['d']) dx += 1;
  if (KEYS['arrowup']    || KEYS['w']) dy -= 1;
  if (KEYS['arrowdown']  || KEYS['s']) dy += 1;
  if (dx || dy) {
    var m = vlen(dx, dy); dx /= m; dy /= m;
    p.vx = dx * 215; p.vy = dy * 215;
    p.face.x = dx; p.face.y = dy;
    p.moving = true;
  } else {
    p.vx *= 0.82; p.vy *= 0.82; p.moving = false;
    // 停下带球时面朝对方球门，方便原地起脚/射门
    if (ball && ball.owner === p) {
      var g = enemyGoalOf(p.team);
      var fx = g.x - p.x, fy = g.y - p.y, fm = vlen(fx, fy) || 1;
      p.face.x = fx / fm; p.face.y = fy / fm;
    }
  }
}

// ---------- AI 平滑移动（有惯性，不抽搐） ----------
function aiSteer(p, tx, ty, speed, dt) {
  var dx = tx - p.x, dy = ty - p.y, d = vlen(dx, dy) || 1;
  var ease = clamp(d / 80, 0.15, 1);
  var desX = dx / d * speed * ease, desY = dy / d * speed * ease;
  var a = Math.min(1, dt * 8);
  p.vx += (desX - p.vx) * a;
  p.vy += (desY - p.vy) * a;
  if (d > 3 && vlen(p.vx, p.vy) > 30) { p.face.x = dx / d; p.face.y = dy / d; }
  if (d < 24) { p.vx *= 0.82; p.vy *= 0.82; }
}
function nearestEnemyOf(p) {
  var b = null, bd = 1e9;
  for (var i = 0; i < players.length; i++) {
    var q = players[i];
    if (q.team === p.team || q === p) continue;
    var d = dist2(q.x, q.y, p.x, p.y);
    if (d < bd) { bd = d; b = q; }
  }
  return { p: b, d: Math.sqrt(bd) };
}

// 球在我方半场吗（被反击的警报）
function inOurHalf(team) {
  var cy = (TY + BY) / 2;
  return team === 0 ? ball.y > cy : ball.y < cy;
}
// 前锋的反击等待位：中圈附近、本方一侧、拉开边路，面朝球随时准备接应
function waitForCounter(p, dt) {
  var cy = (TY + BY) / 2;
  var side = p.slot === 3 ? -1 : 1;
  var dir = p.team === 0 ? 1 : -1;
  aiSteer(p, clamp(CX + side * 170, LX + 30, RX - 30), cy + dir * SOUL[p.team].waitY, 105, dt);
  var fx = ball.x - p.x, fy = ball.y - p.y, fm = vlen(fx, fy) || 1;
  p.face.x = fx / fm; p.face.y = fy / fm;
}

// ============================================================
//  唯一 AI 大脑（两队共用，只换皮肤）
// ============================================================

function aiThink(p, dt) {
  if (p.isGK) { aiKeeper(p, dt); return; }      // 门将走专属逻辑（站门/扑救/开球）

  // 对方门将抱着球：一个都不许堵门——后卫回本方半场防守位、前锋回中圈等反击
  if (ball.owner && ball.owner.isGK && ball.owner.team !== p.team) {
    if (p.slot >= 3) { waitForCounter(p, dt); return; }
    var dirD = p.team === 0 ? 1 : -1;                     // 本方半场方向
    var sideD = p.slot === 0 ? -1 : 1;                    // 左后卫回左、右后卫回右
    aiSteer(p, CX + sideD * 150, (TY + BY) / 2 + dirD * 220, 190, dt);
    return;
  }
  // —— 我正带球：攻门 / 被逼抢就传 / 否则向前带 ——
  if (ball.owner === p) {
    var g = enemyGoalOf(p.team);
    var dG = vlen(g.x - p.x, g.y - p.y) || 1;
    var th = nearestEnemyOf(p);

    // 近门果断射
    if (dG < SOUL[p.team].shotR) {
      var chance = (1 - dG / SOUL[p.team].shotR) * 0.85;
      if (th.p && th.d < 75) chance *= 0.35;
      if (Math.random() < chance) {
        var aimX = CX + (Math.random() < 0.5 ? -1 : 1) * (24 + Math.random() * 46);   // 打角度别喂门将
        kickToward(p, clamp(aimX, CX - GOAL_HALF + 12, CX + GOAL_HALF - 12), g.y, 760, 'shot');
        return;
      }
    }
    // 被贴身逼抢 → 找空位队友（西班牙更早倒脚，阿根廷多带两步）
    if (th.p && th.d < SOUL[p.team].pressD) {
      var t = bestTeammate(p);
      if (t) { kickToward(p, t.x + t.vx * 0.2, t.y + t.vy * 0.2, 410); return; }
    }
    // 带球向前（顺带躲开挡路的敌人）
    var ex = g.x - p.x, ey = g.y - p.y;
    var ev = th.p && th.d < 90 ? (p.x - th.p.x) / (th.d || 1) * 70 : 0;
    aiSteer(p,
      clamp(p.x + ex / dG * 90 + ev, LX + 25, RX - 25),
      clamp(p.y + ey / dG * 90, TY + 25, BY - 25),
      160, dt);
    return;
  }

  var mine = myGoalOf(p.team);

  // —— 我方持球（无球跑位：保持小三角，不散开） ——
  if (ball.owner && ball.owner.team === p.team) {
    supportRun(p, ball.owner, dt);
    return;
  }
  // —— 对方持球：前锋中圈等反击；后卫一人逼抢、一人守线 ——
  if (ball.owner) {
    if (p.slot >= 3) { waitForCounter(p, dt); return; }
    var chaser = pickChaser(p.team);
    if (chaser === p) {
      // 预判持球人，正面贴上去；被反击就全速回追
      var tx = ball.owner.x + ball.owner.vx * 0.14;
      var ty = ball.owner.y + ball.owner.vy * 0.14;
      var spd = inOurHalf(p.team) ? 230 : 190;
      aiSteer(p, clamp(tx, LX + 20, RX - 20), clamp(ty, TY + 20, BY - 20), spd, dt);
    } else {
      holdDefensiveLine(p, mine, ball, dt);
    }
    return;
  }
  // —— 无主球：球在本方半场，前锋不回头；球在中圈/对方半场，最近的前锋去抢 ——
  if (p.slot >= 3) {
    if (!inOurHalf(p.team) && nearestForwardOfTeam(ball.x, ball.y, p.team) === p) {
      aiSteer(p, ball.x, ball.y, 190, dt);       // 开球争球/前场反抢
    } else {
      waitForCounter(p, dt);
    }
    return;
  }
  if (nearestDefenderOfTeam(ball.x, ball.y, p.team) === p) {
    aiSteer(p, ball.x, ball.y, 190, dt);
  } else {
    holdDefensiveLine(p, mine, ball, dt);
  }
}

// 无球队员：我方持球时主动前插——斜插到持球人前方侧翼的空当，给直塞留线路
function supportRun(p, c, dt) {
  var g = enemyGoalOf(p.team);
  var fx = g.x - c.x, fy = g.y - c.y, fl = vlen(fx, fy) || 1;
  var fwdX = fx / fl, fwdY = fy / fl;            // 进攻方向（指向对方球门）
  var rX = -fwdY, rY = fwdX;                     // 进攻方向的右侧
  var side = (p.slot % 2 === 0) ? -1 : 1;        // 偶数槽左路、奇数槽右路，固定不换边
  var K = SOUL[p.team].supportK;                 // 西班牙接应圈更小（短传控球）
  var th = nearestEnemyOf(p);
  var tx, ty;
  if (p.slot < 2) {
    // 后卫：持球人斜后方做回传点，但平时留在本方半场（不过中线）；
    // 球队深压到对方禁区前沿（进攻机会）时才前推到弧顶附近
    var w1 = (th.p && th.d < 60 ? 190 : 150) * K;
    tx = c.x + rX * side * w1 - fwdX * 80 * K;
    ty = c.y + rY * side * w1 - fwdY * 80 * K;
    var cy2 = (TY + BY) / 2;
    var prog = p.team === 0 ? (cy2 - c.y) : (c.y - cy2);   // 持球人压上了多少
    if (p.team === 0) ty = Math.max(ty, prog > 250 ? boxOf(1).hiY + 40 : cy2 - 20);
    else              ty = Math.min(ty, prog > 250 ? boxOf(0).loY - 40 : cy2 + 20);
  } else {
    // 前锋：斜插前方侧翼空当，给直塞留线路
    var w2 = (th.p && th.d < 60 ? 200 : 160) * K;
    tx = c.x + fwdX * 200 * K + rX * side * w2;
    ty = c.y + fwdY * 200 * K + rY * side * w2;
    if (p.team === 0) ty = Math.max(ty, TY + 90);
    else              ty = Math.min(ty, BY - 90);
  }
  aiSteer(p,
    clamp(tx, LX + 30, RX - 30),
    clamp(ty, TY + 30, BY - 30),
    145, dt);
}

// 防守站位：两个退防队员一左一右守住"球—本方球门"连线
function holdDefensiveLine(p, mine, b, dt) {
  // 左后卫守左、右后卫守右，固定不换边，也不跟前锋混抢
  var post = (p.slot === 0 ? -95 : 95);
  var tx = clamp(mine.x + (b.x - mine.x) * 0.35 + post, CX - GOAL_HALF - 60, CX + GOAL_HALF + 60);
  var dy = b.y - mine.y;
  var dd2 = SOUL[p.team].defDepth;
  var depth = clamp(vlen(b.x - mine.x, dy) / 900, dd2[0], dd2[1]);
  var ty = clamp(mine.y + dy * depth, TY + 40, BY - 40);
  var spd = (b.owner && inOurHalf(p.team)) ? 215 : 125;   // 对面打反击：立刻全速回防
  aiSteer(p, tx, ty, spd, dt);
}

// 找一个更好的传球对象（比带球人更靠近对方球门、又没被贴死）
function bestTeammate(p) {
  var g = enemyGoalOf(p.team);
  var p2g = vlen(g.x - p.x, g.y - p.y);
  var best = null, bestScore = -1e9;
  for (var i = 0; i < players.length; i++) {
    var t = players[i];
    if (t.team !== p.team || t === p || t.isGK) continue;
    var th = nearestEnemyOf(t);
    var t2g = vlen(g.x - t.x, g.y - t.y);
    var open = th.p ? th.d : 999;
    var score = (p2g - t2g) * 2 - (open < 48 ? 160 : 0) - 0.25 * t2g + (t.slot >= 3 ? SOUL[p.team].outletFwd * 0.5 : 0);
    if (open > 34 && score > bestScore) { bestScore = score; best = t; }
  }
  return bestScore > 18 ? best : null;
}

// 出脚：把球朝 (tx,ty) 踢出去，之后球只靠惯性滚动，不再被谁带着乱动
function kickToward(p, tx, ty, sp, kind) {
  var dx = tx - p.x, dy = ty - p.y, m = vlen(dx, dy) || 1;
  var fx = dx / m, fy = dy / m;
  ball.vx = fx * sp; ball.vy = fy * sp;
  ball.owner = null; ball.free = 0.14;
  lastKickTeam = p.team;
  if (stats) { if (kind === 'shot') stats[p.team].shot++; else stats[p.team].pass++; }
  p.face.x = fx; p.face.y = fy;
  p.vx = fx * 60; p.vy = fy * 60;               // 出脚轻微前顶
  kickSfx();
}

// 人类按空格：优先传"面朝方向"里的空位队友；没人就射门（带左右方向=打角度）
function humanKick(p) {
  var g = enemyGoalOf(p.team);
  var best = null, bestDot = 0.55;
  for (var i = 0; i < players.length; i++) {
    var t = players[i];
    if (t.team !== p.team || t === p || t.isGK) continue;
    var dx = t.x - p.x, dy = t.y - p.y, d = vlen(dx, dy);
    if (d < 60 || d > 560) continue;
    var dot = (dx / d) * p.face.x + (dy / d) * p.face.y;
    var th = nearestEnemyOf(t);
    if (dot > bestDot && (!th.p || th.d > 40)) { bestDot = dot; best = t; }
  }
  if (best) {
    // 传球 = 瞄准队友"这一瞬"的位置直线传出，之后双方怎么动都不改轨迹
    kickToward(p, best.x, best.y, 420);
    preferCtrl = best; preferT = 0.9;          // 锁定接球人，传球路上就能接管
  } else {
    kickToward(p, postForShot(p), g.y, 760, 'shot');   // 朝门柱内侧打，别总踢中路喂门将
    preferCtrl = null; preferT = 0;            // 射门不锁人
  }
}
// 射门目标：顺着你面朝方向打近/远角；直直冲门时自动打门将另一侧空角
function postForShot(p) {
  var want = p.face.x;
  var gk = gkOf(p.team === 0 ? 1 : 0);          // 对方门将
  if (Math.abs(want) < 0.15) {
    if (!gk) want = 0;
    else if (Math.abs(gk.x - CX) < 24) want = Math.random() < 0.5 ? -1 : 1;
    else want = gk.x > CX ? -1 : 1;             // 打门将不在的那一侧
  }
  return clamp(CX + want * (GOAL_HALF - 18), CX - GOAL_HALF + 12, CX + GOAL_HALF - 12);
}

// ---------- 门将 AI（站门 / 扑救在 stepBall 里做 / 拿球后开球分边） ----------
function catchSfx() { snd('sine', 0.13, 150, 90, 0.06); }
function aiKeeper(p, dt) {
  var box = boxOf(p.team);
  var g = enemyGoalOf(p.team);

  // 侧扑中：前 0.35s 保持扑出的冲量（身体真的甩向球侧），之后 0.4s 缓慢恢复
  if (p.diveT > 0) {
    p.diveT -= dt;
    p.face.x = p.diveDir; p.face.y = 0;
    if (ball.owner !== p) {
      if (p.diveT > 0.4) { p.vx *= (1 - dt * 2); p.vy *= (1 - dt * 2); }
      else aiSteer(p, p.x, p.y, 30, dt);
      return;
    }
  }

  // 门将拿住球：先抱稳观察，禁区内还有对方球员就不传（等他们退出去）；
  // 找到真正空位的队友才传；实在没线路才大脚解围
  if (ball.owner === p) {
    p.gkHold += dt;
    aiSteer(p, p.x, p.y, 40, dt);
    if (p.gkHold < 0.9) return;                  // 至少抱 0.9 秒，观察传球线路
    if (p.gkHold < 4 && foeInMyBox(p)) return;   // 禁区内有敌人：抱着等他们退出去
    var t = outletTeammate(p);
    if (t) {
      p.gkHold = 0;
      kickToward(p, t.x + t.vx * 0.2, t.y + t.vy * 0.2, 500);
      return;
    }
    if (p.gkHold > 3.5) {                        // 等太久也没人空 → 大脚开到边路（不闷给对面门将）
      p.gkHold = 0;
      var sideX = ball.x < CX ? RX - 90 : LX + 90;             // 开到弱侧边线
      var cyk = (TY + BY) / 2;
      var fwdY = p.team === 0 ? cyk - 150 : cyk + 150;         // 过中线，但远离对方禁区
      kickToward(p, sideX, fwdY, 740);
    }
    return;
  }
  p.gkHold = 0;

  // 出击收球：球无主、停/慢滚在本方禁区里，且我比任何对方球员都更近 → 果断上去拿
  if (!ball.owner) {
    var sp2 = vlen(ball.vx, ball.vy);
    var inBox = ball.x > box.x0 && ball.x < box.x1 && ball.y > box.loY && ball.y < box.hiY;
    if (inBox && sp2 < 300) {
      var foeD = 1e9;
      for (var i2 = 0; i2 < players.length; i2++) {
        var q2 = players[i2];
        if (q2.team === p.team || q2.isGK) continue;
        var dd = dist2(q2.x, q2.y, ball.x, ball.y);
        if (dd < foeD) foeD = dd;
      }
      var myD = dist2(p.x, p.y, ball.x, ball.y);
      if (myD < foeD - 900) {                    // 我明显更近（30px 以上优势）才出击
        aiSteer(p, ball.x, ball.y, 215 * GK_SPEED_F, dt);
        var afx = ball.x - p.x, afy = ball.y - p.y, am = vlen(afx, afy) || 1;
        p.face.x = afx / am; p.face.y = afy / am;
        return;
      }
    }
  }

  // 站位：永远守住球门中央，只随球路小幅偏移（×0.6），绝不站出两根门柱；
  // 球离门越远，门将往前压一点、缩小射门角度
  var tx = clamp(CX + (ball.x - CX) * 0.6, CX - GOAL_HALF + 20, CX + GOAL_HALF - 20);
  var distLine = Math.abs(ball.y - box.gy);
  var front = clamp((distLine - 130) / ((BY - TY) * 0.8), 0, 1);
  var off = 18 + front * (BOX_DEPTH - 34);
  var ty = box.gy + box.s * off;
  aiSteer(p, tx, ty, 215 * GK_SPEED_F, dt);      // 门将速度 = 球员 172 × 0.75
  var fx = ball.x - p.x, fy = ball.y - p.y, fm = vlen(fx, fy) || 1;
  p.face.x = fx / fm; p.face.y = fy / fm;
}
// 有对方球员站在本方禁区里吗？（门将开球前要等他们退出去）
function foeInMyBox(gk) {
  var box = boxOf(gk.team);
  for (var i = 0; i < players.length; i++) {
    var q = players[i];
    if (q.team === gk.team || q.isGK) continue;
    if (q.x > box.x0 && q.x < box.x1 && q.y > box.loY && q.y < box.hiY) return true;
  }
  return false;
}
// 从 a 传到 b 的线路上有没有对方球员挡着（40px 内算堵）
function laneClear(a, b, team) {
  for (var i = 0; i < players.length; i++) {
    var q = players[i];
    if (q.team === team) continue;
    var vx = b.x - a.x, vy = b.y - a.y;
    var tt = clamp(((q.x - a.x) * vx + (q.y - a.y) * vy) / (vx * vx + vy * vy), 0, 1);
    var px = a.x + vx * tt, py = a.y + vy * tt;
    if (dist2(q.x, q.y, px, py) < 40 * 40) return false;
  }
  return true;
}
// 门将把球分给谁：只考虑"传球线路真正空"的队友（身边 60px 内没敌人），否则返回 null
function outletTeammate(gk) {
  var g = enemyGoalOf(gk.team);
  var best = null, bestScore = -1e9;
  for (var i = 0; i < players.length; i++) {
    var t = players[i];
    if (t.team !== gk.team || t === gk || t.isGK) continue;
    var th = nearestEnemyOf(t);
    var open = th.p ? th.d : 999;
    if (open <= 45) continue;                    // 人被贴着，不考虑
    if (!laneClear(gk, t, gk.team)) continue;      // 传球线路上有对方球员，不考虑
    var t2g = vlen(g.x - t.x, g.y - t.y);
    var score = open - t2g * 0.2 + (t.slot >= 3 ? SOUL[gk.team].outletFwd : 0);   // 阿根廷优先长传找前锋
    if (score > bestScore) { bestScore = score; best = t; }
  }
  return best;                                   // null = 没有安全线路
}
// 这球门将能不能扑住：球在自己禁区、正朝自己门飞、又够得着
function keeperCanCatch() {
  if (ball.owner) return null;
  var sp = vlen(ball.vx, ball.vy);
  if (sp < 120) return null;                      // 慢球走正常"谁近谁拿"
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (!p.isGK) continue;
    var box = boxOf(p.team);
    if (ball.x < box.x0 || ball.x > box.x1) continue;
    if (ball.y < box.loY || ball.y > box.hiY) continue;
    var towardGoal = p.team === 0 ? ball.vy > 60 : ball.vy < -60;
    if (!towardGoal) continue;
    var reach = p.r + ball.r + GK_REACH + (p.diveT > 0.4 ? 16 : 0);   // 扑出瞬间手套范围更大
    if (dist2(p.x, p.y, ball.x, ball.y) < reach * reach) return p;
  }
  return null;
}

// 蓄力射门：松开空格或蓄满时出脚
// <35% 软弱无力（门将好扑）/ 35%~70% 正常 / 70%~100% 更快但会射偏（100% 自动出脚）
function humanShoot(p, ch) {
  var g = enemyGoalOf(p.team);
  var aimX = postForShot(p), sp;
  if (ch >= 0.7) {
    sp = 880;
    var off = (ch - 0.7) / 0.3;                                 // 越满偏越多
    aimX += (Math.random() < 0.5 ? -1 : 1) * (25 + off * 75);   // 蓄过头，脚法变形
    aimX = clamp(aimX, CX - GOAL_HALF - 32, CX + GOAL_HALF + 32);          // 可能擦柱甚至射飞
  } else if (ch < 0.35) {
    sp = 400;
  } else {
    sp = 760;
  }
  kickToward(p, aimX, g.y, sp, 'shot');
  preferCtrl = null; preferT = 0;
}

// ---------- 球 ----------
function stepBall(dt) {
  var b = ball;
  b.free = Math.max(0, b.free - dt);          // 保护期计时（无论球是否有人拿）
  if (b.owner) {
    // 带球：球黏在脚前
    var o = b.owner;
    var dx = o.face.x, dy = o.face.y, m = vlen(dx, dy);
    if (m < 0.1) { dx = 0; dy = o.team === 0 ? -1 : 1; } else { dx /= m; dy /= m; }
    b.x = o.x + dx * (o.r + b.r + 2);
    b.y = o.y + dy * (o.r + b.r + 2);
    b.vx = o.vx; b.vy = o.vy;
    return;
  }
  // 自由球：只受摩擦和边界影响，方向不再被人改
  var damp = Math.exp(-dt * 1.4);
  b.vx *= damp; b.vy *= damp;
  if (Math.abs(b.vx) < 5) b.vx = 0;
  if (Math.abs(b.vy) < 5) b.vy = 0;
  b.x += b.vx * dt; b.y += b.vy * dt;

  // 门将侧扑触发：球快速朝球门飞、进了禁区、离门将不远 → 整个人甩出去
  for (var gi = 0; gi < players.length; gi++) {
    var gk2 = players[gi];
    if (!gk2.isGK || gk2.diveT > 0) continue;
    var bx2 = boxOf(gk2.team);
    if (b.x < bx2.x0 || b.x > bx2.x1 || b.y < bx2.loY || b.y > bx2.hiY) continue;
    var spg = vlen(b.vx, b.vy);
    var toward2 = gk2.team === 0 ? b.vy > 60 : b.vy < -60;
    if (spg > 220 && toward2 && dist2(gk2.x, gk2.y, b.x, b.y) < 120 * 120) {
      gk2.diveT = 0.75;                          // 0.35s 扑出 + 0.4s 缓慢恢复
      gk2.diveDir = b.x >= gk2.x ? 1 : -1;
      gk2.vx = gk2.diveDir * 170;                // 身体朝球那一侧扑出去（一点点，不夸张）
      snd('sine', 0.12, 240, 130, 0.05);         // 扑球风声
    }
  }

  // 门将扑救优先于进球判定：够得着就抱住，之后自动分给队友
  var gkSave = keeperCanCatch();
  if (gkSave) {
    ball.owner = gkSave; ball.vx = ball.vy = 0;
    ball.free = 0.5;                             // 扑住保护期，防原地被捅走
    lastKickTeam = gkSave.team;
    gkSave.gkHold = 0;
    if (stats) stats[gkSave.team].save++;
    var gyUp = gkSave.team === 0 ? TY : BY;
    var fdx = CX - gkSave.x, fdy = gyUp - gkSave.y, fm2 = vlen(fdx, fdy) || 1;
    gkSave.face.x = fdx / fm2; gkSave.face.y = fdy / fm2;   // 面朝对方半场，准备开球
    catchSfx();
    return;
  }

  var sp = vlen(b.vx, b.vy);
  // 上边（AI 守的门 = 玩家攻的门）
  if (b.y - b.r < TY) {
    if (Math.abs(b.x - CX) < GOAL_HALF) goalFor(0);
    else { b.y = TY + b.r; b.vy = -b.vy * 0.55; }
  }
  if (b.y + b.r > BY) {
    if (Math.abs(b.x - CX) < GOAL_HALF) goalFor(1);
    else { b.y = BY - b.r; b.vy = -b.vy * 0.55; }
  }
  if (b.x - b.r < LX) { b.x = LX + b.r; b.vx = -b.vx * 0.55; }
  if (b.x + b.r > RX) { b.x = RX - b.r; b.vx = -b.vx * 0.55; }
}
function goalFor(team) {                     // team = 进球的队伍编号（0阿根廷/1西班牙）
  if (state !== 'play') return;
  var idx = team === pickIdx ? 0 : 1;        // scores[0]=你，scores[1]=AI
  scores[idx]++;
  goalFlash = 1.4; goalSide = idx; goalTeam = team;
  goalSfx();
  if (scores[idx] >= 5) { endMatch(); return; }
  setupPositions();          // 立刻刷回中圈
  state = 'kickoff';
  readyT = 3.0;
}

// 抢球/接球：决定球被谁拿住或挡下
function settleBall() {
  var b = ball;
  if (b.owner) {
    // 对手碰到"球"才算抢断（碰人不算），球权归抢断者（有短暂保护防互抢）
    if (b.free > 0) return;
    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      if (p.team === b.owner.team) continue;
      var rr = p.r + b.r + 2;                  // 脚够到球才算断球
      if (dist2(p.x, p.y, b.x, b.y) < rr * rr) {
        var o = b.owner;
        var dx = o.x - p.x, dy = o.y - p.y, dm = vlen(dx, dy) || 1;
        b.owner = p; b.vx = b.vy = 0;
        b.free = 0.45;                       // 抢断保护期：刚断下的球不会立刻被反抢
        lastKickTeam = p.team;
        o.vx = dx / dm * 150; o.vy = dy / dm * 150;   // 被断的人踉跄一下，拉开身位
        kickSfx();
        return;
      }
    }
    return;
  }

  var sp = vlen(b.vx, b.vy);
  for (var j = 0; j < players.length; j++) {
    var q = players[j];
    var reach = q.r + b.r + 2;
    if (dist2(q.x, q.y, b.x, b.y) > reach * reach) continue;

    if (sp > 150) {
      // 球滚得快：自己的传球让自家队友接住；对方只能挡掉（弹开），不能吸走
      if (q.team === lastKickTeam && b.free <= 0) {
        if (sp < 600) { b.owner = q; b.vx = b.vy = 0; return; }   // 第一脚停球
        continue;
      }
      if (q.team !== lastKickTeam || lastKickTeam < 0) {
        // 挡：弹向别处
        var dx2 = q.x - b.x, dy2 = q.y - b.y, dm2 = vlen(dx2, dy2) || 1;
        b.x = q.x + dx2 / dm2 * reach;
        b.y = q.y + dy2 / dm2 * reach;
        b.vx = dx2 / dm2 * Math.max(120, sp * 0.45);
        b.vy = dy2 / dm2 * Math.max(120, sp * 0.45);
        b.free = 0.1;
        lastKickTeam = -1;
        kickSfx();
        return;
      }
    } else if (b.free <= 0) {
      // 球慢下来了：谁离得近就能拿
      b.owner = q; b.vx = b.vy = 0; return;
    }
  }
}

// ---------- 主更新 ----------
function update(dt) {
  if (state === 'menu' || state === 'over') return;

  if (state === 'kickoff') {
    goalFlash = Math.max(0, goalFlash - dt);
    readyT -= dt;
    if (readyT <= 0) { state = 'play'; ball.free = 0.3; }
    return;
  }

  if (scores[0] >= 5 || scores[1] >= 5) { endMatch(); return; }
  if (clock <= 0 && scores[0] !== scores[1]) { endMatch(); return; }
  clock = Math.max(0, clock - dt);
  goalFlash = Math.max(0, goalFlash - dt);
  if (ball.owner) stats[ball.owner.team].poss += dt;   // 控球率按持球时间算

  // 决定操控对象（丢球=最近的人，持球=带球人，不会乱跳）
  preferT = Math.max(0, preferT - dt);
  ctrlAge += dt;
  var nCtrl = controlledPlayer();
  if (nCtrl !== ctrl) ctrlAge = 0;
  ctrl = nCtrl;

  var i, p;
  for (i = 0; i < players.length; i++) {
    p = players[i];
    if (p === ctrl) humanMove(p, dt);
    else aiThink(p, dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.x = clamp(p.x, LX + p.r, RX - p.r);
    p.y = clamp(p.y, TY + p.r + 5, BY - p.r - 5);
    if (p.isGK) {                       // 门将活动范围锁在自己禁区里
      var box = boxOf(p.team);
      p.x = clamp(p.x, box.x0 + 6, box.x1 - 6);
      p.y = clamp(p.y, box.loY + 6, box.hiY - 6);
    }
    p.moving = (Math.abs(p.vx) + Math.abs(p.vy)) > 25;
    if (p.moving) p.bob += dt * 7;              // 速度减半了，摆腿频率也跟上
    p.blink -= dt; if (p.blink < -0.12) p.blink = 2 + Math.random() * 4;
  }
  // 人跟人推开
  for (i = 0; i < players.length; i++) {
    for (var j = i + 1; j < players.length; j++) {
      var a = players[i], c = players[j];
      var dx = c.x - a.x, dy = c.y - a.y, d2 = dx * dx + dy * dy, minD = a.r + c.r;
      if (d2 < minD * minD && d2 > 0.01) {
        var d = Math.sqrt(d2), push = (minD - d) / d * 0.5;
        a.x -= dx * push; a.y -= dy * push;
        c.x += dx * push; c.y += dy * push;
      }
    }
  }

  // 格挡/挤碰后把门将再锁回禁区一次，别被推出框
  for (i = 0; i < players.length; i++) {
    p = players[i];
    if (!p.isGK) continue;
    var bbox = boxOf(p.team);
    p.x = clamp(p.x, bbox.x0 + 6, bbox.x1 - 6);
    p.y = clamp(p.y, bbox.loY + 6, bbox.hiY - 6);
  }

  // 门将抱球期间，对方球员一律不得留在禁区（规则性驱离，对玩家操控的也生效）
  if (ball.owner && ball.owner.isGK) {
    var hbox = boxOf(ball.owner.team);
    var outY2 = hbox.gy + hbox.s * (BOX_DEPTH + 46);
    for (i = 0; i < players.length; i++) {
      p = players[i];
      if (p.team === ball.owner.team || p.isGK) continue;
      if (p.x > hbox.x0 && p.x < hbox.x1 && p.y > hbox.loY && p.y < hbox.hiY) {
        p.y += (outY2 - p.y) * Math.min(1, dt * 6);   // 温柔地请出去
      }
    }
  }

  // 球
  stepBall(dt);
  if (state !== 'play') return;
  settleBall();

  // 空格：本方半场按下=传球/射门；过了半场按住=蓄力射门，松开（或蓄满）出脚
  var spNow = !!KEYS[' '];
  var ow = ball.owner;
  if (charging) {
    charge = Math.min(1, charge + dt / 1.0);   // 1 秒蓄满
    if (!(ow && ow.team === pickIdx && !ow.isGK)) {
      charging = false; charge = 0;              // 球被断了，蓄力作废
    } else if (!spNow) {
      humanShoot(ow, charge); charging = false; charge = 0;
    } else if (charge >= 1) {
      humanShoot(ow, 1); charging = false; charge = 0;   // 蓄满自动射（会偏）
    }
  } else if (spNow && !prevSpace && ow && ow.team === pickIdx && !ow.isGK) {
    if (inOpponentHalf(ow)) { charging = true; charge = 0; }
    else humanKick(ow);
  }
  prevSpace = spNow;
}

function endMatch() {
  winner = scores[0] > scores[1] ? 0 : 1;
  state = 'over';
}

  var t0 = pickIdx, t1 = pickIdx ^ 1;
  var pt = stats[t0].poss + stats[t1].poss || 1;
  var poss0 = Math.round(stats[t0].poss / pt * 100);
  var rows = [
    ['比分',     '' + scores[0],           '' + scores[1]],
    ['控球率',   poss0 + '%',              (100 - poss0) + '%'],
    ['传球',     '' + stats[t0].pass,      '' + stats[t1].pass],
    ['射门',     '' + stats[t0].shot,      '' + stats[t1].shot],
    ['门将扑救', '' + stats[t0].save,      '' + stats[t1].save]
  ];
  var xL = CX - 200, xR = CX + 200, y = 465;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = t0 === 0 ? '#ffffff' : '#e05146';
  ctx.fillText(TEAMS[t0].name + '（你）', xL, y);
  ctx.fillStyle = t1 === 0 ? '#ffffff' : '#e05146';
  ctx.fillText(TEAMS[t1].name, xR, y);
  ctx.fillStyle = '#9fb0c2'; ctx.font = 'bold 20px sans-serif';
  ctx.fillText('全场技术统计', CX, y);
  y += 18;
  for (var i = 0; i < rows.length; i++) {
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(CX - 300, y); ctx.lineTo(CX + 300, y); ctx.stroke();
    ctx.fillStyle = '#8fa0b3'; ctx.font = '18px sans-serif';
    ctx.fillText(rows[i][0], CX, y + 32);
    var v0win = parseFloat(rows[i][1]) >= parseFloat(rows[i][2]);   // 占优的加亮
    ctx.font = 'bold 24px sans-serif';
    ctx.fillStyle = v0win ? '#ffe14d' : '#c8d3de';
    ctx.fillText(rows[i][1], xL, y + 32);
    ctx.fillStyle = v0win ? '#c8d3de' : '#ffe14d';
    ctx.fillText(rows[i][2], xR, y + 32);
    y += 52;
  }

  ctx.fillStyle = '#9fb0c2'; ctx.font = '18px sans-serif';
  ctx.fillText('按 Space / Enter 回主菜单', CX, y + 40);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { drawMenu(); return; }
  drawPitch();
  var list = players.slice().sort(function (a, b) { return a.y - b.y; });
  for (var i = 0; i < list.length; i++) drawChibi(list[i]);
  drawBall();
  drawCharge();
  drawHUD();
  if (state === 'play' || state === 'kickoff') drawFlash();
  if (state === 'kickoff') drawKickoff();
  if (state === 'over') drawOver();
}

// ---------- 主循环 ----------
var last = performance.now();
function loop(t) {
  var dt = Math.min(0.033, (t - last) / 1000);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
